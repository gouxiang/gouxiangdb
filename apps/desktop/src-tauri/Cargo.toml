[package]
name = "gouxiangdb-desktop"
# 仅占位：tauri build 时以 tauri.conf.json 的 version 为准覆盖此值；tauri.conf.json 与根
# package.json 共同构成版本单源（升版三处同改：根 package.json / tauri.conf.json / 本占位）。
version = "0.2.6"
description = "GouXiangDB macOS desktop shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# sidecar：用 Tauri shell 插件的 externalBin 拉起随包 Node 运行 apps/api。
# 钉死 2.2.1：泛版本 "2" 范围内含已知安全漏洞版本（依赖安全闸门拦截）。
tauri-plugin-shell = "=2.2.1"
# PoC-3：Tauri 自带 updater（minisign 完整性校验，无需 Apple 账号）。
# 选 2.13.3：其依赖约束 tauri "^2.12"、reqwest "^0.13"，与现锁 tauri 2.12.4 / reqwest 0.13.5 共存，不拖核心升级。
# default-features=false：去掉仅 Windows v1 包用的 zip 依赖（zip 4.x 全 yanked，会导致 resolve 失败）；
# macOS 用 tar.gz（flate2/tar，插件内 macOS 目标自带）。保留 rustls-tls：最终生产更新源是 https Gitea。
# 仅在构建期 --config 注入 updater 段、且运行期 GX_POC3=1 时才发起检查；默认不注册任何自动行为。
tauri-plugin-updater = { version = "=2.13.3", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ── R1 壳口（IMPL §4 阶段 R1）─────────────────────────────────────────────
# 红线：只用锁树内已有的 1.x hyper/tower/rustls 生态，绝不得引入 aws-lc-rs（全树计数须为 0）。
# TLS 两通道（HTTP reqwest / WSS 手写隧道）统一走 macOS 系统钥匙串校验
# （rustls-platform-verifier）+ 进程级幂等安装的 ring crypto provider：内网自签/私有 CA
# 装进登录钥匙串即被信任，不硬编码 webpki 根。
#
# axum 0.8：default-features 精剪，只用 http1 + tokio（JSON 响应手写，不引 json/form/query）。
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# tokio：壳口 listener / WS copy_bidirectional / 上游状态互斥 / headless 单测运行时。
# 钉 ≥1.44.2（安全闸门已知漏洞下限，锁内实为 1.53.3）。
tokio = { version = "1.44.2", features = [
  "rt",
  "rt-multi-thread",
  "net",
  "sync",
  "io-util",
  "time",
  "macros",
] }
# HTTP 反代客户端。rustls-no-provider = platform-verifier + __rustls，不拖 aws-lc-rs
# （普通 "rustls" feature 会带 __rustls-aws-lc-rs）；crypto provider 由我们手动装 ring。
# stream = Body::wrap_stream 请求体流式转发（multipart 不全量缓冲）。
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "stream",
] }
# 入站升级 OnUpgrade 类型（hyper server/http1；出站是手写 HTTP/1.1，不用 hyper client）。
hyper = { version = "1", features = ["http1", "server"] }
# TokioIo：把 hyper 升级后的裸流桥到 tokio IO 做 copy_bidirectional（只需 tokio feature）。
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# 上游 base / WS 目标 URL 解析。
url = "2"
# WSS 隧道 TLS：钉 ≥0.23.18（避开安全闸门已知漏洞版，锁内实为 0.23.46）。
rustls = { version = "0.23.18", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
# 直接边：proxy_ws.rs 直接调 ClientConfig::with_platform_verifier()（Rust 2018 传递依赖不在 extern prelude）。
rustls-platform-verifier = "0.7"

[profile.release]
# PoC 阶段用 thin LTO + 多 codegen units：避免 fat LTO 最终链接在 16GB 机上产生内存尖峰；
# 体积差异对壳二进制可忽略。正式发布前可再收紧为 fat LTO。编译并发另由 CARGO_BUILD_JOBS=2 限制。
opt-level = "s"
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
