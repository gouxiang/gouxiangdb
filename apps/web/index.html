<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- %BASE_URL% 由 Vite 构建期替换：根路径→/favicon.svg，子路径→/app/gouxiangdb/favicon.svg。
         用绝对（带 base）形式而非 ./ 相对，避免 SPA 深层路由 /base/xxx/... 下相对 document URL 解析错位。 -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="theme-color" content="#F7A81B" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>构想工作台</title>
  </head>
  <body class="bg-gx-bg text-gx-text-primary font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
