# GouXiangDB 安全审计日志轮换（logrotate 片段）
#
# 安装：sudo cp deploy/logrotate/gouxiangdb.conf /etc/logrotate.d/gouxiangdb
# 前置：应用以 gouxiangdb 用户运行，审计目录 /var/log/gouxiangdb（见 config.auditDir）。
#
# 应用以 append 打开 audit.logl，不做 reopen；用 copytruncate 让 logrotate
# 复制后原地截断，应用无需重启、不丢写句柄。

/var/log/gouxiangdb/audit.logl {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    create 0640 gouxiangdb gouxiangdb
    su root root
}
