<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>构想工作台 · UI v2 全域骨架（单文件版）</title>
<style>
/* ============================================================
   构想工作台 · UI v2 设计令牌（唯一取值来源）
   ------------------------------------------------------------
   规则：
   1) 原型里任何颜色/圆角/字号/间距，只能引用本文件的变量。
      出现散落 hex 即视为不合格（与旧 UI-SPEC §0.2 同一条纪律）。
   2) 将来落地时，本文件逐条映射到
      packages/design-tokens/src/colors.ts（现 106 行）与 layout.ts。
      改取值即可，不重新解读设计稿。
   3) 命名对齐项目现有 gx-* 习惯，方便对照替换。
   ============================================================ */

:root {
  /* ---------- 表面 / 层次 ---------- */
  --gx-bg: #f7f7f5;            /* 壳层底色：暖中性，比旧版冷灰更沉静 */
  --gx-surface: #ffffff;       /* 内容区、面板、卡片 */
  --gx-surface-sunken: #f2f2ef;/* 凹陷：表头、代码块、输入内槽 */
  --gx-surface-hover: #efefec; /* hover 底 */
  --gx-surface-active: #e6e6e2;/* pressed / 选中底 */

  /* ---------- 文字 ---------- */
  --gx-text: #1a1a1c;          /* 主文字（近墨黑，非纯黑） */
  --gx-text-secondary: #6b6b73;/* 次要：说明、副标题 */
  --gx-text-tertiary: #9a9aa2; /* 弱：占位、元信息 */
  --gx-text-inverse: #ffffff;

  /* ---------- 描边 ---------- */
  --gx-line: #e8e8e5;          /* 默认分隔线（极淡，靠留白分层） */
  --gx-line-strong: #d7d7d2;   /* 输入框、需要强调的边界 */

  /* ---------- 主强调：墨黑 ---------- */
  /* 刻意不用彩色做主强调：让业务色标（行色、标签、状态）成为唯一的色彩来源 */
  --gx-ink: #1a1a1c;
  --gx-ink-hover: #2e2e33;
  --gx-ink-soft: #eaeae6;      /* 墨黑弱底：选中/徽标 */
  --gx-ink-text: #1a1a1c;

  /* ---------- 焦点环 / 链接（唯一彩色强调，只用于可访问性） ---------- */
  --gx-focus: #4338ca;
  --gx-focus-ring: 0 0 0 3px rgba(67, 56, 202, 0.18);
  --gx-link: #3a34b8;

  /* ---------- 语义色 ---------- */
  --gx-danger: #b42318;
  --gx-danger-soft: #fef3f2;
  --gx-warn: #b54708;
  --gx-warn-soft: #fffaeb;
  --gx-success: #067647;
  --gx-success-soft: #ecfdf3;
  --gx-info: #175cd3;
  --gx-info-soft: #eff8ff;

  /* ---------- 圆角 ---------- */
  --gx-r-xs: 4px;
  --gx-r-sm: 6px;              /* 列表项、按钮、输入 */
  --gx-r-md: 10px;             /* 卡片、面板 */
  --gx-r-lg: 14px;             /* 浮层、弹窗、抽屉 */
  --gx-r-full: 999px;

  /* ---------- 字号 / 行高 ---------- */
  --gx-fs-11: 11px;
  --gx-fs-12: 12px;
  --gx-fs-13: 13px;            /* 基准字号，比旧版 14 更紧凑 */
  --gx-fs-15: 15px;
  --gx-fs-18: 18px;
  --gx-fs-24: 24px;
  --gx-lh-tight: 1.3;
  --gx-lh-normal: 1.55;

  /* ---------- 间距（4 基数） ---------- */
  --gx-sp-1: 4px;
  --gx-sp-2: 8px;
  --gx-sp-3: 12px;
  --gx-sp-4: 16px;
  --gx-sp-5: 20px;
  --gx-sp-6: 24px;
  --gx-sp-8: 32px;
  --gx-sp-10: 40px;

  /* ---------- 阴影（极克制，仅浮层） ---------- */
  --gx-shadow-1: 0 1px 2px rgba(26, 26, 28, 0.06);
  --gx-shadow-2: 0 2px 6px rgba(26, 26, 28, 0.06), 0 8px 24px -8px rgba(26, 26, 28, 0.14);
  --gx-shadow-3: 0 4px 12px rgba(26, 26, 28, 0.08), 0 24px 48px -16px rgba(26, 26, 28, 0.18);

  /* ---------- 壳层尺寸（与旧规范对齐，落地方便对照） ---------- */
  --gx-h-topbar: 56px;
  --gx-w-l1: 224px;
  --gx-w-l1-collapsed: 56px;
  --gx-w-l2: 240px;
  --gx-h-viewtabs: 44px;

  /* ---------- 字体 ---------- */
  --gx-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --gx-font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

</style>
<style>
/* ============================================================
   原型样式：查看器 chrome + 被设计产品的骨架
   取值全部来自 tokens.css，不新增任何 hex。
   ============================================================ */

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  font-family: var(--gx-font);
  font-size: var(--gx-fs-13);
  color: var(--gx-text);
  background: var(--gx-bg);
  -webkit-font-smoothing: antialiased;
}

/* ============ 脚本未执行兜底提示 ============ */
.boot-warn {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 99;
  padding: var(--gx-sp-3) var(--gx-sp-4);
  background: var(--gx-warn-soft);
  border-bottom: 1px solid var(--gx-warn);
  color: var(--gx-text);
  font-size: var(--gx-fs-12);
  line-height: 1.6;
}
.boot-warn code {
  font-family: var(--gx-font-mono);
  font-size: var(--gx-fs-11);
  background: var(--gx-surface);
  padding: 1px 5px;
  border-radius: var(--gx-r-xs);
}
body.booting .boot-warn { display: block; }

/* ============ 查看器：左侧页面清单 ============ */
.viewer {
  display: grid;
  grid-template-columns: 268px 1fr;
  height: 100vh;
  overflow: hidden;
}

.rail {
  background: var(--gx-surface);
  border-right: 1px solid var(--gx-line);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.rail-head {
  padding: var(--gx-sp-4) var(--gx-sp-4) var(--gx-sp-3);
  border-bottom: 1px solid var(--gx-line);
}
.rail-title {
  font-size: var(--gx-fs-13);
  font-weight: 600;
  letter-spacing: -0.01em;
}
.rail-sub {
  margin-top: 2px;
  font-size: var(--gx-fs-11);
  color: var(--gx-text-tertiary);
}

.rail-body { flex: 1; overflow-y: auto; padding: var(--gx-sp-2) 0 var(--gx-sp-6); }

.rail-group {
  padding: var(--gx-sp-3) var(--gx-sp-4) var(--gx-sp-1);
  font-size: var(--gx-fs-11);
  font-weight: 600;
  color: var(--gx-text-tertiary);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.rail-item {
  display: flex;
  align-items: center;
  gap: var(--gx-sp-2);
  width: 100%;
  margin: 1px var(--gx-sp-2);
  padding: 6px var(--gx-sp-2);
  border: 0;
  border-radius: var(--gx-r-sm);
  background: transparent;
  font: inherit;
  font-size: var(--gx-fs-13);
  text-align: left;
  color: var(--gx-text-secondary);
  text-decoration: none;
  line-height: 1.35;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}
.rail-item:focus-visible { outline: none; box-shadow: var(--gx-focus-ring); }
.rail-item:hover { background: var(--gx-surface-hover); color: var(--gx-text); }
.rail-item.is-active {
  background: var(--gx-ink-soft);
  color: var(--gx-ink-text);
  font-weight: 600;
}
.rail-idx {
  flex: none;
  width: 18px;
  font-variant-numeric: tabular-nums;
  font-size: var(--gx-fs-11);
  color: var(--gx-text-tertiary);
}
.rail-item.is-active .rail-idx { color: var(--gx-ink-text); }

/* ============ 查看器：顶部信息条 ============ */
.stage-wrap {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}

.stage-bar {
  flex: none;
  height: 48px;
  display: flex;
  align-items: center;
  gap: var(--gx-sp-3);
  padding: 0 var(--gx-sp-4);
  background: var(--gx-surface);
  border-bottom: 1px solid var(--gx-line);
}
.stage-name { font-weight: 600; }
.stage-route {
  font-family: var(--gx-font-mono);
  font-size: var(--gx-fs-11);
  color: var(--gx-text-tertiary);
  background: var(--gx-surface-sunken);
  padding: 2px 6px;
  border-radius: var(--gx-r-xs);
}
.stage-spacer { flex: 1; }

.seg {
  display: inline-flex;
  padding: 2px;
  background: var(--gx-surface-sunken);
  border-radius: var(--gx-r-sm);
}
.seg button {
  border: 0;
  background: transparent;
  font: inherit;
  font-size: var(--gx-fs-11);
  color: var(--gx-text-secondary);
  padding: 4px 8px;
  border-radius: var(--gx-r-xs);
  cursor: pointer;
}
.seg button.is-on {
  background: var(--gx-surface);
  color: var(--gx-text);
  font-weight: 600;
  box-shadow: var(--gx-shadow-1);
}

.stage-scroll {
  flex: 1;
  overflow: auto;
  padding: var(--gx-sp-6);
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.stage-btn {
  border: 1px solid var(--gx-line);
  background: var(--gx-surface);
  color: var(--gx-text-secondary);
  font: inherit;
  font-size: var(--gx-fs-11);
  padding: 5px 10px;
  border-radius: var(--gx-r-sm);
  cursor: pointer;
}
.stage-btn:hover { background: var(--gx-surface-hover); }
.stage-btn.is-on {
  background: var(--gx-ink);
  border-color: var(--gx-ink);
  color: var(--gx-text-inverse);
  font-weight: 600;
}

/* 缩放容器：transform 不改变布局尺寸，靠外层撑出占位 */
#canvasFit { flex: none; }

/* 1440×900 画布，用 transform 缩放 */
.canvas {
  flex: none;
  width: 1440px;
  height: 900px;
  background: var(--gx-surface);
  border-radius: var(--gx-r-md);
  box-shadow: 0 0 0 1px var(--gx-line), var(--gx-shadow-2);
  overflow: hidden;
  transform-origin: top left;
}

/* ============ 被设计产品：壳层骨架 ============ */
.app {
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--gx-bg);
}

/* TopBar */
.gx-topbar {
  flex: none;
  height: var(--gx-h-topbar);
  display: flex;
  align-items: center;
  gap: var(--gx-sp-3);
  padding: 0 var(--gx-sp-4);
  background: var(--gx-surface);
  border-bottom: 1px solid var(--gx-line);
}
.gx-brand {
  display: flex;
  align-items: center;
  gap: var(--gx-sp-2);
  font-weight: 600;
  letter-spacing: -0.01em;
}
.gx-brand-mark {
  width: 22px;
  height: 22px;
  border-radius: var(--gx-r-sm);
  background: var(--gx-ink);
}
.gx-searchpill {
  width: 280px;
  height: 30px;
  display: flex;
  align-items: center;
  gap: var(--gx-sp-2);
  padding: 0 var(--gx-sp-3);
  background: var(--gx-surface-sunken);
  border-radius: var(--gx-r-sm);
  color: var(--gx-text-tertiary);
  font-size: var(--gx-fs-12);
}
.kbd {
  margin-left: auto;
  font-family: var(--gx-font-mono);
  font-size: var(--gx-fs-11);
  color: var(--gx-text-tertiary);
}
.gx-avatar {
  width: 26px;
  height: 26px;
  border-radius: var(--gx-r-full);
  background: var(--gx-ink-soft);
  box-shadow: inset 0 0 0 1px var(--gx-line-strong);
}

/* 主体三栏 */
.gx-body { flex: 1; display: flex; min-height: 0; }

/* L1 */
.gx-l1 {
  flex: none;
  width: var(--gx-w-l1);
  display: flex;
  flex-direction: column;
  padding: var(--gx-sp-3) var(--gx-sp-2);
  border-right: 1px solid var(--gx-line);
  background: var(--gx-bg);
}
.gx-l1-scroll { flex: 1; display: flex; flex-direction: column; gap: 1px; }
.gx-l1-foot {
  flex: none;
  padding-top: var(--gx-sp-2);
  margin-top: var(--gx-sp-2);
  border-top: 1px solid var(--gx-line);
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.gx-nav-item {
  display: flex;
  align-items: center;
  gap: var(--gx-sp-2);
  height: 30px;
  padding: 0 var(--gx-sp-2);
  border-radius: var(--gx-r-sm);
  color: var(--gx-text-secondary);
  font-size: var(--gx-fs-13);
}
.gx-nav-item.is-active {
  background: var(--gx-surface);
  color: var(--gx-ink-text);
  font-weight: 600;
  box-shadow: var(--gx-shadow-1);
}
.gx-nav-dot {
  width: 16px;
  height: 16px;
  flex: none;
  border-radius: var(--gx-r-xs);
  background: var(--gx-surface-active);
}
.gx-nav-item.is-active .gx-nav-dot { background: var(--gx-ink); }
.gx-usercard {
  display: flex;
  align-items: center;
  gap: var(--gx-sp-2);
  margin-top: var(--gx-sp-2);
  padding: var(--gx-sp-2);
  border-radius: var(--gx-r-sm);
  background: var(--gx-surface);
  box-shadow: var(--gx-shadow-1);
  font-size: var(--gx-fs-12);
  color: var(--gx-text-secondary);
}

/* L2 */
.gx-l2 {
  flex: none;
  width: var(--gx-w-l2);
  display: flex;
  flex-direction: column;
  background: var(--gx-surface);
  border-right: 1px solid var(--gx-line);
}
.gx-l2-head {
  flex: none;
  min-height: 52px;
  display: flex;
  align-items: center;
  gap: var(--gx-sp-2);
  padding: var(--gx-sp-2) var(--gx-sp-3);
  border-bottom: 1px solid var(--gx-line);
}
.gx-l2-title { font-weight: 600; font-size: var(--gx-fs-13); }
.gx-l2-scroll { flex: 1; overflow: hidden; padding: var(--gx-sp-2); display: flex; flex-direction: column; gap: 1px; }
.gx-l2-item {
  display: flex;
  align-items: center;
  gap: var(--gx-sp-2);
  height: 30px;
  padding: 0 var(--gx-sp-2);
  border-radius: var(--gx-r-sm);
  color: var(--gx-text-secondary);
  font-size: var(--gx-fs-13);
}
.gx-l2-item.is-active {
  background: var(--gx-bg);
  color: var(--gx-ink-text);
  font-weight: 600;
}

/* 内容区 */
.gx-content {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--gx-surface);
}
.gx-viewtabs {
  flex: none;
  height: var(--gx-h-viewtabs);
  display: flex;
  align-items: center;
  gap: var(--gx-sp-1);
  padding: 0 var(--gx-sp-4);
  border-bottom: 1px solid var(--gx-line);
}
.gx-tab {
  height: 28px;
  display: inline-flex;
  align-items: center;
  padding: 0 var(--gx-sp-3);
  border-radius: var(--gx-r-sm);
  font-size: var(--gx-fs-12);
  color: var(--gx-text-secondary);
}
.gx-tab.is-active {
  background: var(--gx-surface);
  color: var(--gx-ink-text);
  font-weight: 600;
  box-shadow: var(--gx-shadow-1);
}

.gx-canvas-area {
  flex: 1;
  min-height: 0;
  padding: var(--gx-sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--gx-sp-3);
  overflow: hidden;
}

/* ============ 骨架块 ============ */
.node {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: var(--gx-sp-2);
  border: 1px dashed var(--gx-line-strong);
  border-radius: var(--gx-r-sm);
  background: repeating-linear-gradient(
    45deg,
    transparent,
    transparent 6px,
    rgba(26, 26, 28, 0.018) 6px,
    rgba(26, 26, 28, 0.018) 12px
  );
  color: var(--gx-text-tertiary);
  text-align: center;
  min-height: 0;
  overflow: hidden;
}
.node-row { flex-direction: row; gap: var(--gx-sp-2); align-items: stretch; }
.node-fill { flex: 1; }
.node-name {
  font-size: var(--gx-fs-12);
  font-weight: 600;
  color: var(--gx-text-secondary);
  letter-spacing: 0.01em;
}
.node-note {
  font-size: var(--gx-fs-11);
  color: var(--gx-text-tertiary);
  line-height: 1.4;
  max-width: 92%;
}

/* 内容区里"像内容"的块：更实一点 */
.node.is-solid {
  border-style: solid;
  border-color: var(--gx-line);
  background: var(--gx-surface);
}
.node.is-solid .node-name { color: var(--gx-text); }

/* 浮层演示 */
.gx-overlay {
  position: relative;
  flex: 1;
  min-height: 0;
}
.gx-scrim {
  position: absolute;
  inset: 0;
  background: rgba(26, 26, 28, 0.28);
  border-radius: var(--gx-r-sm);
}
.gx-sheet {
  position: absolute;
  background: var(--gx-surface);
  border-radius: var(--gx-r-lg);
  box-shadow: var(--gx-shadow-3);
  padding: var(--gx-sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--gx-sp-3);
}
.gx-sheet.is-drawer {
  top: 0;
  right: 0;
  bottom: 0;
  width: 480px;
  border-radius: var(--gx-r-lg) 0 0 var(--gx-r-lg);
}
.gx-sheet.is-modal {
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 560px;
  max-height: 78%;
}
.gx-sheet-title { font-size: var(--gx-fs-15); font-weight: 600; }

/* 标注开关 */
.annot-off .node-note { display: none; }
.annot-off .node { border-color: var(--gx-line); }

/* 独立页（登录/分享/启动器）画布 */
.standalone {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--gx-bg);
  padding: var(--gx-sp-10);
}
.standalone-card {
  width: 400px;
  background: var(--gx-surface);
  border-radius: var(--gx-r-lg);
  box-shadow: 0 0 0 1px var(--gx-line), var(--gx-shadow-2);
  padding: var(--gx-sp-8);
  display: flex;
  flex-direction: column;
  gap: var(--gx-sp-4);
}

</style>
</head>
<body class="booting">

<div class="boot-warn" id="bootWarn">
  <strong>脚本没有执行</strong>，所以左侧清单是空的、点不动。
  当前环境（预览面板 / 快速预览）很可能拦了本地脚本 —— 请用浏览器打开这个文件：
  <code>docs/design/2026-10-ui-redesign/index.html</code>
  <br />
  或者直接看单文件版 <code>standalone.html</code>（资源全内联，不需要加载外部 js/css）。
</div>

<div class="viewer">
  <aside class="rail">
    <div class="rail-head">
      <div class="rail-title">构想工作台 · UI v2 骨架</div>
      <div class="rail-sub">全站 <span id="pageCount"></span> 页 · 只看结构，不做视觉</div>
    </div>
    <div class="rail-body" id="railBody"></div>
  </aside>

  <main class="stage-wrap">
    <div class="stage-bar">
      <button class="stage-btn" id="prevBtn" title="上一页 ↑">↑</button>
      <button class="stage-btn" id="nextBtn" title="下一页 ↓">↓</button>
      <span class="stage-name" id="stageName"></span>
      <code class="stage-route" id="stageRoute"></code>
      <div class="stage-spacer"></div>
      <div class="seg" id="zoomSeg">
        <button data-z="0.5">50%</button>
        <button data-z="0.75" class="is-on">75%</button>
        <button data-z="1">100%</button>
      </div>
      <button class="stage-btn is-on" id="annotBtn">区域标注</button>
    </div>

    <div class="stage-scroll">
      <div id="canvasFit">

<script>
/* ============================================================
   骨架渲染器（纯静态，无依赖，file:// 直接可开）
   ============================================================ */

(function () {
  var pages = window.GX_PAGES || [];
  var groups = window.GX_GROUPS || [];
  var state = { zoom: 0.75, annot: true };

  var railBody = document.getElementById("railBody");
  var stageName = document.getElementById("stageName");
  var stageRoute = document.getElementById("stageRoute");
  var stageStage = document.getElementById("stageStage");
  var canvasFit = document.getElementById("canvasFit");
  var canvas = document.getElementById("canvas");

  /* ---------- 左侧清单 ---------- */
  function renderRail(activeId) {
    railBody.innerHTML = "";
    groups.forEach(function (g) {
      var items = pages.filter(function (p) { return p.group === g; });
      if (!items.length) return;

      var h = document.createElement("div");
      h.className = "rail-group";
      h.textContent = g;
      railBody.appendChild(h);

      items.forEach(function (p) {
        /* 用 button 而不是 <a href="#...">：不产生任何导航，
           避免预览面板 / iframe sandbox 拦截同文档跳转导致"点不动" */
        var a = document.createElement("button");
        a.type = "button";
        a.className = "rail-item" + (p.id === activeId ? " is-active" : "");
        a.dataset.pageId = p.id;

        var idx = document.createElement("span");
        idx.className = "rail-idx";
        idx.textContent = String(pages.indexOf(p) + 1).padStart(2, "0");

        var label = document.createElement("span");
        label.textContent = p.name;

        a.appendChild(idx);
        a.appendChild(label);
        a.addEventListener("click", function (e) {
          e.preventDefault();
          go(p.id);
        });
        railBody.appendChild(a);
      });
    });
  }

  /* ---------- 骨架块 ---------- */
  function blockEl(b, parentFlex) {
    if (b.row) {
      var row = document.createElement("div");
      row.className = "node node-row";
      row.style.height = (b.h || 0) + "px";
      if (b.flex) row.style.flex = b.flex + " 1 0";
      b.row.forEach(function (child) {
        var c = blockEl(child, true);
        if (!c) return;
        if (child.flex) { c.style.flex = child.flex + " 1 0"; c.style.height = "auto"; }
        row.appendChild(c);
      });
      return row;
    }

    if (!b.h && !b.flex && !b.w) return null; // h:0 = 条件出现，不占位

    var el = document.createElement("div");
    el.className = "node" + (b.solid ? " is-solid" : "");

    if (b.w) {
      el.style.flex = "none";
      el.style.width = b.w + "px";
      el.style.height = "auto";
    } else if (b.flex) {
      el.style.flex = b.flex + " 1 0";
      el.style.height = "auto";
    } else {
      el.style.flex = "none";
      el.style.height = b.h + "px";
    }

    var n = document.createElement("div");
    n.className = "node-name";
    n.textContent = b.name;
    el.appendChild(n);

    if (b.note) {
      var note = document.createElement("div");
      note.className = "node-note";
      note.textContent = b.note;
      el.appendChild(note);
    }
    return el;
  }

  function fillBlocks(container, blocks) {
    (blocks || []).forEach(function (b) {
      var el = blockEl(b);
      if (el) container.appendChild(el);
    });
  }

  /* ---------- 壳层 ---------- */
  var L1_UP = [
    { id: "portal", label: "个人门户" },
    { id: "tables", label: "工作区数据库" },
    { id: "kb", label: "知识库" },
  ];
  var L1_DOWN = [
    { id: "contacts", label: "通讯录" },
    { id: "authz", label: "权限管理" },
    { id: "nav", label: "导航编排" },
    { id: "settings", label: "工作区设置" },
  ];

  function navItem(label, active) {
    var d = document.createElement("div");
    d.className = "gx-nav-item" + (active ? " is-active" : "");
    var dot = document.createElement("span");
    dot.className = "gx-nav-dot";
    var t = document.createElement("span");
    t.textContent = label;
    d.appendChild(dot);
    d.appendChild(t);
    return d;
  }

  function buildTopBar() {
    var bar = document.createElement("div");
    bar.className = "gx-topbar";
    bar.innerHTML =
      '<div class="gx-brand"><span class="gx-brand-mark"></span><span>构想工作台</span></div>' +
      '<div class="gx-searchpill"><span>搜索表、文档、成员</span><span class="kbd">⌘K</span></div>' +
      '<div style="flex:1"></div>' +
      '<div class="gx-searchpill" style="width:auto;background:transparent;padding:0 8px">帮助</div>' +
      '<div class="gx-avatar"></div>';
    return bar;
  }

  function buildL1(active) {
    var l1 = document.createElement("div");
    l1.className = "gx-l1";

    var scroll = document.createElement("div");
    scroll.className = "gx-l1-scroll";
    L1_UP.forEach(function (i) { scroll.appendChild(navItem(i.label, active === i.id)); });
    l1.appendChild(scroll);

    var foot = document.createElement("div");
    foot.className = "gx-l1-foot";
    L1_DOWN.forEach(function (i) { foot.appendChild(navItem(i.label, active === i.id)); });
    var card = document.createElement("div");
    card.className = "gx-usercard";
    card.innerHTML = '<span class="gx-avatar" style="width:20px;height:20px"></span><span>戴 · 工作区所有人</span>';
    foot.appendChild(card);
    l1.appendChild(foot);
    return l1;
  }

  function l2Item(label, active, indent) {
    var d = document.createElement("div");
    d.className = "gx-l2-item" + (active ? " is-active" : "");
    if (indent) d.style.paddingLeft = 8 + indent * 12 + "px";
    d.textContent = label;
    return d;
  }

  function buildL2(kind, pageName) {
    var l2 = document.createElement("div");
    l2.className = "gx-l2";

    var head = document.createElement("div");
    head.className = "gx-l2-head";
    head.innerHTML = '<span class="gx-nav-dot" style="background:var(--gx-ink)"></span><span class="gx-l2-title">产品中心</span>';
    l2.appendChild(head);

    var scroll = document.createElement("div");
    scroll.className = "gx-l2-scroll";

    if (kind === "tables") {
      scroll.appendChild(l2Item("＋ 新建数据表", false));
      ["需求池", "迭代计划", "缺陷跟踪", "客户档案", "内容排期", "供应商", "指标口径"].forEach(function (t, i) {
        scroll.appendChild(l2Item(t, pageName.indexOf("数据表主界面") > -1 && i === 0));
      });
    } else if (kind === "docs") {
      scroll.appendChild(l2Item("＋ 新建文档", false));
      scroll.appendChild(l2Item("产品", false));
      scroll.appendChild(l2Item("需求说明", true, 1));
      scroll.appendChild(l2Item("竞品调研", false, 1));
      scroll.appendChild(l2Item("研发", false));
      scroll.appendChild(l2Item("接口约定", false, 1));
      scroll.appendChild(l2Item("运维手册", false, 1));
      scroll.appendChild(l2Item("会议纪要", false));
    } else if (kind === "settings") {
      scroll.appendChild(l2Item("概览", true));
      scroll.appendChild(l2Item("数据表", false));
      scroll.appendChild(l2Item("成员与权限", false));
      scroll.appendChild(l2Item("回收站", false));
      scroll.appendChild(l2Item("危险操作", false));
    }
    l2.appendChild(scroll);
    return l2;
  }

  function buildViewTabs(tabs) {
    var bar = document.createElement("div");
    bar.className = "gx-viewtabs";
    tabs.forEach(function (t, i) {
      var el = document.createElement("span");
      el.className = "gx-tab" + (i === 0 ? " is-active" : "");
      el.textContent = t;
      bar.appendChild(el);
    });
    return bar;
  }

  function buildShell(page) {
    var app = document.createElement("div");
    app.className = "app";
    app.appendChild(buildTopBar());

    var body = document.createElement("div");
    body.className = "gx-body";
    body.appendChild(buildL1(page.l1));
    if (page.l2) body.appendChild(buildL2(page.l2, page.name));

    var content = document.createElement("div");
    content.className = "gx-content";
    if (page.tabs) content.appendChild(buildViewTabs(page.tabs));

    var area = document.createElement("div");
    area.className = "gx-canvas-area";
    fillBlocks(area, page.blocks);
    content.appendChild(area);

    body.appendChild(content);
    app.appendChild(body);
    return app;
  }

  /* ---------- 浮层 ---------- */
  function applyOverlay(app, ov) {
    var content = app.querySelector(".gx-content");
    var overlay = document.createElement("div");
    overlay.className = "gx-overlay";

    var scrim = document.createElement("div");
    scrim.className = "gx-scrim";
    if (ov.type === "popover") scrim.style.background = "transparent";
    overlay.appendChild(scrim);

    var sheet = document.createElement("div");
    sheet.className = "gx-sheet " + (ov.type === "drawer" ? "is-drawer" : "is-modal");
    if (ov.type === "popover") {
      sheet.style.top = "16px";
      sheet.style.left = "50%";
      sheet.style.transform = "translateX(-50%)";
      sheet.style.width = "520px";
      sheet.style.maxHeight = "none";
    }

    var title = document.createElement("div");
    title.className = "gx-sheet-title";
    title.textContent = ov.type === "drawer" ? "记录详情" : (ov.type === "modal" ? "对话框" : "浮层");
    sheet.appendChild(title);

    var box = document.createElement("div");
    box.style.cssText = "display:flex;flex-direction:column;gap:8px;flex:1;min-height:0";
    fillBlocks(box, ov.blocks);
    sheet.appendChild(box);

    overlay.appendChild(sheet);
    content.appendChild(overlay);
  }

  function buildStandalone(page) {
    var wrap = document.createElement("div");
    wrap.className = "standalone";
    var card = document.createElement("div");
    card.className = "standalone-card";
    fillBlocks(card, page.blocks);
    wrap.appendChild(card);
    return wrap;
  }

  /* ---------- 舞台 ---------- */
  function applyZoom() {
    canvas.style.transform = "scale(" + state.zoom + ")";
    canvasFit.style.width = 1440 * state.zoom + "px";
    canvasFit.style.height = 900 * state.zoom + "px";
  }

  function render(id) {
    var page = pageById(id);

    currentPageId = page.id;
    renderRail(page.id);
    stageName.textContent = page.name;
    stageRoute.textContent = page.route;

    canvas.innerHTML = "";
    canvas.classList.toggle("annot-off", !state.annot);

    if (page.kind === "standalone") {
      canvas.appendChild(buildStandalone(page));
    } else {
      var basePage = page;
      if (page.kind === "overlay" && page.base) {
        basePage = pages.filter(function (p) { return p.id === page.base; })[0] || page;
      }
      var app = buildShell(basePage);
      if (page.kind === "overlay" && page.overlay) applyOverlay(app, page.overlay);
      canvas.appendChild(app);
    }

    applyZoom();
    document.title = page.name + " · UI v2 骨架";
  }

  var currentPageId = null;

  function pageById(id) {
    return pages.filter(function (p) { return p.id === id; })[0] || pages[0];
  }

  function currentId() {
    var h = "";
    try { h = location.hash.replace(/^#\/?/, ""); } catch (e) { h = ""; }
    return h || pages[0].id;
  }

  /* 切换页面：直接渲染，不依赖任何导航行为 */
  function go(id) {
    var page = pageById(id);
    render(page.id);
    try {
      if (location.hash !== "#/" + page.id) {
        history.replaceState(null, "", "#/" + page.id);
      }
    } catch (e) { /* 受限环境（sandbox / file://）写不了 hash 也不影响使用 */ }
  }

  function step(delta) {
    var i = pages.indexOf(pageById(currentPageId || currentId()));
    go(pages[(i + delta + pages.length) % pages.length].id);
  }

  window.addEventListener("hashchange", function () {
    var id = currentId();
    if (id !== currentPageId) render(id);
  });

  document.getElementById("zoomSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    state.zoom = parseFloat(b.dataset.z);
    Array.prototype.forEach.call(this.children, function (c) {
      c.classList.toggle("is-on", c === b);
    });
    applyZoom();
  });

  document.getElementById("annotBtn").addEventListener("click", function () {
    state.annot = !state.annot;
    this.classList.toggle("is-on", state.annot);
    canvas.classList.toggle("annot-off", !state.annot);
  });

  document.getElementById("prevBtn").addEventListener("click", function () { step(-1); });
  document.getElementById("nextBtn").addEventListener("click", function () { step(1); });

  /* 键盘翻页：多一条不依赖鼠标的路径 */
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); step(1); }
    if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); step(-1); }
  });

  go(currentId());

  /* 脚本成功跑完 → 收起"未执行"提示 */
  document.body.classList.remove("booting");
})();

</script>
<script>
  try {
    document.getElementById("pageCount").textContent = window.GX_PAGES.length;
  } catch (e) { /* 脚本未加载时保持空，由 boot-warn 提示 */ }
</script>
</body>
</html>
