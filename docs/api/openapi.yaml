openapi: 3.0.3
info:
  title: GouXiangDB 企业版 API
  version: 1.0.0
  description: >-
    M3 出口冻结的企业版 /api/v1 契约首版：汇合 M2 组织通讯录（部门/成员/角色/邀请）
    与 M3 统一导航资源树（tree/menu/group/move）。旧 /api/* 非企业版端点不在本文档，契约零变化。

    M4（S4-S8）增补统一权限引擎只读/管理面：/authz/visible-scope 可见集探针、
    /nodes/{id}/policies（GET/PUT）节点授权策略、/nodes/{id}/effective 决策解释器、
    /nodes/{id}/inheritance（impact/PATCH）中断继承、/nodes/{id}/breadcrumb 中性截断面包屑。
    旧 /api records 写字段越权以 403 FORBIDDEN_FIELD 整单拒绝。


    响应风格（总监裁决 2/5 定案，M3 出口冻结为现网风格）：成功返回资源本体、数组，
    或分页对象 {items,total,page,limit,hasMore}；错误统一为 {error, code}。
    不使用 {code:0,data,message} 信封；信封切换若做另开切片。


    除 POST /auth/invite/accept 外，全部端点要求 Authorization: Bearer <JWT>，
    且账号 ACTIVE、JWT tv claim 与 users.tokenVersion 匹配。


    功能面受两个正交开关控制：GX_ENTERPRISE_ORG 暴露 /meta、/org/*、公开邀请接受；
    GX_ENTERPRISE_NAV 暴露 /workspaces/*、/nav/*、/nodes/*。仅一个开启时只暴露对应子面；
    请求未开启子面的已挂载路径，登录用户得到 404（鉴权链先执行，无 token 为 401）。
servers:
  - url: /api/v1
    description: 根路径部署（经 Caddy/网关）；basePath 子路径部署同样适用，前缀由部署层改写

tags:
  - name: meta
  - name: authz
  - name: auth-invite
  - name: departments
  - name: members
  - name: roles
  - name: workspaces
  - name: nav-groups
  - name: nodes
  - name: search-admin
  # M6/S9 增补：PAT 管理面（/api/v1/pats）。协议面 /mcp 非 REST，见文末 x-mcp 扩展节。
  - name: pats

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    BadRequest:
      description: 请求参数/白名单/作用域/防环/层级非法
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 未登录、token 失效、账号停用或 tv 不匹配
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 已登录但缺少所需组织管理动作
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 同名冲突/前置条件未满足/操作需确认
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: 请求体超过大小上限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: 触发速率限制
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    MethodNotAllowed:
      description: 对系统角色执行了不允许的操作（删/改 key/改动作）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    # M6/S9 增补：PAT 管理面专用响应。
    PatNotFound:
      description: 令牌不存在或非本人所有（统一 404，不泄漏存在性）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    McpRateLimited:
      description: 触发 MCP 面独立敏感档限流（PAT 创建/删除与 /mcp 入口各自独立窗口）
      headers:
        Retry-After:
          description: 建议重试等待秒数（当前固定窗剩余时间）
          schema: { type: integer, example: 60 }
        X-RateLimit-Limit:
          description: 本窗口配额上限
          schema: { type: integer, example: 30 }
        X-RateLimit-Remaining:
          description: 本窗口剩余可用次数
          schema: { type: integer, example: 0 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: 中文错误文案 }
        code:
          type: string
          enum:
            - BAD_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - HTTP_405
            - PAYLOAD_TOO_LARGE
            - TOO_MANY_REQUESTS
            - INTERNAL
            - NAV_CYCLE
            - NAV_DEPTH_EXCEEDED
            - NAV_MENU_DEPTH
            - NAV_NODE_IN_USE
            - NAV_GROUP_NOT_EMPTY
            - NAV_RESOURCE_MISSING
            - MOVE_NEEDS_CONFIRM
            - INHERITANCE_CONFIRM_REQUIRED
            - NODE_NOT_INHERITABLE
            - NODE_NOT_FOUND
            # M4/S8 权限域定名冻结（去重后全集）：
            - FORBIDDEN_FIELD
            - FORBIDDEN_RESOURCE
            - POLICY_CONFLICT
            - POLICY_CONDITION_UNSUPPORTED
            # M4/S5 策略整单写校验码（PolicyValidationError.code 原样透传，HTTP 状态见 policies PUT）：
            - POLICY_NODE_NOT_FOUND
            - POLICY_NODE_KIND_INVALID
            - POLICY_SUBJECT_INVALID
            - POLICY_ACTION_INVALID
            - POLICY_FIELD_INVALID
            - POLICY_BAD_INPUT
            # M5/S9 统一检索管理面专用码（只增）：
            - SEARCH_UNAVAILABLE
            - REINDEX_IN_PROGRESS
            - REINDEX_FAILED
            - EMBEDDING_CONFIG_INVALID
            - NEED_CLOUD_CONFIRM
            # M6/S9 鉴权 MCP 面专用码（只增）：
            - PAT_NOT_FOUND
            - PAT_NAME_INVALID
            - PAT_SCOPE_INVALID
            - PAT_EXPIRY_INVALID
            - MCP_RATE_LIMITED
            - MCP_PAYLOAD_TOO_LARGE
          description: >-
            未显式指定机器码时按 HTTP 状态回落（400->BAD_REQUEST 等）；
            NAV_* 与 MOVE_NEEDS_CONFIRM 为导航域专用码；
            INHERITANCE_CONFIRM_REQUIRED/NODE_NOT_INHERITABLE 为 M4/S7 继承域专用码。
            M4/S8 权限域六枚定名：FORBIDDEN_FIELD=记录写 payload 含不可见/只读字段键（旧 /api records 三写端点，
            403 整单拒绝）；FORBIDDEN_RESOURCE=主体已认证但本次资源/动作无权（M6 MCP 结构化拒绝词汇，
            REST v1 当前 403 回落泛 FORBIDDEN，M6 工具面启用本码）；POLICY_CONFLICT=同节点同主体多策略行
            违反唯一意图等冲突（M4 整单写为 upsert 覆盖语义，不经 HTTP 产出；巡检 C4_DUPLICATE_POLICY 为只读码）；
            INHERITANCE_CONFIRM_REQUIRED/NODE_NOT_INHERITABLE 见继承端点；POLICY_CONDITION_UNSUPPORTED 为
            A-7 行级条件预留（本期不实现：upsert 不接受/不持久化 conditions 键，P1 启用时非 null 一律 400 本码）。
            POLICY_* 六枚为策略写校验细码，仅 /nodes/{id}/policies PUT 产出。
            M6/S9 鉴权 MCP 面五枚（只增）：PAT_NOT_FOUND=令牌不存在或非本人（404，不泄漏存在性）；
            PAT_NAME_INVALID/PAT_SCOPE_INVALID/PAT_EXPIRY_INVALID=创建 PAT 入参校验（400，
            PatValidationError 的 code 原样透传）；MCP_RATE_LIMITED=PAT 创建/删除敏感档限流
            （429，附 Retry-After 与 X-RateLimit-*；/mcp 入口同码，见文末 x-mcp）。
            /mcp 协议面不走本文档的 REST 语义，工具面结构化拒绝码见 x-mcp.tool-error-envelope。
        path: { type: string, description: 仅顶层 404 notFound 附带 }
    Meta:
      type: object
      properties:
        apiVersion: { type: string, example: v1 }
        enterpriseOrg: { type: boolean, example: true }
        auth:
          type: object
          properties:
            userId: { type: string }
            status: { type: string }
            workspaceId: { type: string, nullable: true }

    # ----- M4/S4 authz visible-scope -----
    VisibleScope:
      type: object
      required:
        [userId, actions, kinds, nodeIds, resourceIdsByType, maskedTableFields,
         truncated, policyVersion, budget, evaluated, visibleTotal, materialize, count]
      properties:
        userId: { type: string, description: 实际求值的目标用户 id }
        actions:
          type: array
          items: { type: string, enum: [r, c, u, d, comment, manage_share, manage_schema, enter, edit_data] }
        kinds:
          type: array
          nullable: true
          items: { type: string, enum: [base, kb, table, view, doc, canvas, group] }
          description: 入参回显（缺省为 null = 全部资源类型；未知值已被忽略）
        nodeIds:
          type: array
          description: 预算内有序可见 nav 节点 id（path,id 确定性排序）
          items: { type: string }
        resourceIdsByType:
          type: object
          description: 按资源类型归集的实体 id（nav.resourceId），供 M5 直接 IN 实体表
          additionalProperties:
            type: array
            items: { type: string }
        maskedTableFields:
          type: object
          description: 仅 r 动作；存在 fieldMask 收窄的 table 节点 -> allowFields 白名单
          additionalProperties:
            type: array
            items: { type: string }
        truncated: { type: boolean, description: 是否在预算处被截断 }
        policyVersion: { type: integer, description: workspaces.policyVersion 快照 }
        budget: { type: integer, example: 5000 }
        evaluated: { type: integer, description: 扫描的活资源节点数（诊断用，不参与授权） }
        visibleTotal: { type: integer, description: 截断前可见全集大小 }
        materialize:
          type: string
          enum: [in_list, temp_table]
          description: >-
            in_list=nodeIds 可直接参数化 IN（<=499 且未截断），域内 buildVisibleScopeSql
            产出 sql="?,?.."/params=nodeIds/单批 batches；
            temp_table=域内 sql 为空串（sql=""、params=[]、expectsTempTable=true、batches=[]），
            M5 必须先物化为 search.db 临时表再 JOIN，禁止超长 IN 直拼。HTTP 层仅回传本枚举，
            不直接暴露 sql/expectsTempTable（实现细节，空串即"必须物化"的契约信号）。
        count: { type: integer, description: nodeIds 长度（截断后实际返回数） }

    # ----- M4/S5-S8 权限域命名组件（S8 冻结；与 routes/v1/policies.ts、policyQuery.ts 真实形状一致）-----
    FieldMask:
      type: object
      description: >-
        命中 allow 之上的字段能力裁剪（收窄清单，不是 deny/授权清单）；挂在 table 节点策略行。
        缺省对象/缺省键 = 不裁剪。allowFields 收窄可见字段；readOnlyFields 声明该来源下只读字段。
      properties:
        allowFields: { type: array, items: { type: string }, description: 该 table 内可见字段 id 白名单 }
        readOnlyFields: { type: array, items: { type: string }, description: 该来源下只读字段 id }
    PolicySubject:
      type: object
      required: [subjectType, subjectId, subjectName]
      properties:
        subjectType: { type: string, enum: [user, dept, role] }
        subjectId: { type: string }
        subjectName: { type: string, nullable: true, description: user=displayName，role/dept=name；悬挂主体为 null }
    PolicyRow:
      type: object
      description: GET policies 的 direct[] 行：节点自身的一条直接策略。
      required: [id, subjectType, subjectId, subjectName, actions, fieldMask, reason, createdAt]
      properties:
        id: { type: string, description: auth_policies 行 id }
        subjectType: { type: string, enum: [user, dept, role] }
        subjectId: { type: string }
        subjectName: { type: string, nullable: true }
        actions: { type: array, items: { type: string } }
        fieldMask: { oneOf: [{ $ref: '#/components/schemas/FieldMask' }, { type: 'null' }] }
        reason: { type: string, nullable: true, description: 策略来源（policy:v1 / legacy:* 投影标记） }
        createdAt: { type: string, format: date-time }
    PolicyAncestorSummary:
      type: object
      description: cutoff 链上某祖先节点会向下继承到本节点的只读策略摘要。
      required: [nodeId, nodeName, policies]
      properties:
        nodeId: { type: string }
        nodeName: { type: string }
        policies:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/PolicySubject'
              - type: object
                required: [actions]
                properties:
                  actions: { type: array, items: { type: string, enum: [r, c, u, d, comment, manage_share, manage_schema, enter, edit_data] } }
    NodePoliciesView:
      type: object
      required: [node, inheritAncestors, direct, ancestors]
      properties:
        node:
          type: object
          required: [id, kind, resourceType, name, inheritAncestors]
          properties:
            id: { type: string }
            kind: { type: string, enum: [base, kb, table, view, doc, canvas, group] }
            resourceType: { type: string, nullable: true }
            name: { type: string }
            inheritAncestors: { type: integer, enum: [0, 1] }
        inheritAncestors: { type: boolean, description: 节点是否继承祖先（inheritAncestors===1） }
        direct: { type: array, items: { $ref: '#/components/schemas/PolicyRow' } }
        ancestors: { type: array, items: { $ref: '#/components/schemas/PolicyAncestorSummary' } }
    PolicyChange:
      type: object
      description: PUT policies upserts[] 单项（整单全合法才提交）。
      required: [subjectType, subjectId, actions]
      properties:
        subjectType: { type: string, enum: [user, dept, role] }
        subjectId: { type: string }
        actions:
          type: array
          minItems: 1
          items: { type: string, enum: [r, c, u, d, comment, manage_share, manage_schema, enter, edit_data] }
        fieldMask: { oneOf: [{ $ref: '#/components/schemas/FieldMask' }, { type: 'null' }] }
        # 注意：A-7 行级条件本期不实现，conditions 键不被读取也不持久化（非 null 条件 P1 启用时
        # 返回 400 POLICY_CONDITION_UNSUPPORTED），故本请求 schema 不声明 conditions。
    PolicyDelete:
      type: object
      required: [subjectType, subjectId]
      properties:
        subjectType: { type: string, enum: [user, dept, role] }
        subjectId: { type: string }
    PolicyWriteRequest:
      type: object
      description: upserts/deletes 至少一项；upserts<=200、deletes<=500。
      properties:
        upserts: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/PolicyChange' } }
        deletes: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/PolicyDelete' } }
    LegacyUnmappableItem:
      type: object
      required: [subjectType, subjectId, reasons]
      properties:
        subjectType: { type: string, enum: [user, dept, role] }
        subjectId: { type: string }
        reasons: { type: array, items: { type: string }, description: 不可反写旧三表的原因（非标动作组合/角色或部门授予/fieldMask/无旧表节点类型） }
    PolicyWriteResult:
      type: object
      required: [node, policyVersion, upserted, deleted, legacyUnmappable]
      description: 200 成功载荷。legacyUnmappable 是成功明细（裁决 A-5），不是错误码、不阻断提交。
      properties:
        node:
          type: object
          required: [id, kind, resourceType, resourceId, name]
          properties:
            id: { type: string }
            kind: { type: string, enum: [base, kb, table, view, doc, canvas, group] }
            resourceType: { type: string, nullable: true }
            resourceId: { type: string, nullable: true }
            name: { type: string }
        policyVersion: { type: integer }
        upserted: { type: integer }
        deleted: { type: integer }
        legacyUnmappable: { type: array, items: { $ref: '#/components/schemas/LegacyUnmappableItem' } }
    DiagSource:
      type: object
      description: effective perAction.sources[] 单条授予来源（O8 可解释来源链）。
      required: [kind, policyId, nodeId, nodeName, viaAncestor, subjectType, subjectId, subjectName, fallback]
      properties:
        kind: { type: string, enum: [direct, dept, role, owner_fallback] }
        policyId: { type: string, nullable: true, description: 命中的 auth_policies 行 id；owner_fallback 为 null }
        nodeId: { type: string, description: 授予实际挂载的节点（可能是祖先） }
        nodeName: { type: string, nullable: true }
        viaAncestor: { type: boolean, description: 授予是否经祖先节点继承而来（非节点自身直挂） }
        subjectType: { type: string, enum: [user, dept, role] }
        subjectId: { type: string }
        subjectName: { type: string, nullable: true }
        fallback: { type: string, nullable: true, enum: [workspace_owner, creator] }
    EffectivePermission:
      type: object
      description: effective perAction[] 单项：一枚资源动作的最终判定与完整来源链。
      required: [action, allowed, sources]
      properties:
        action: { type: string, enum: [r, c, u, d, comment, manage_share, manage_schema, enter, edit_data] }
        allowed: { type: boolean }
        sources: { type: array, items: { $ref: '#/components/schemas/DiagSource' } }
    EffectiveView:
      type: object
      required: [node, userId, actions, policyVersion, perAction]
      properties:
        node:
          type: object
          required: [id, kind, resourceType, name]
          properties:
            id: { type: string }
            kind: { type: string, enum: [base, kb, table, view, doc, canvas, group] }
            resourceType: { type: string, nullable: true }
            name: { type: string }
        userId: { type: string }
        actions: { type: array, items: { type: string, enum: [r, c, u, d, comment, manage_share, manage_schema, enter, edit_data] }, description: 最终允许的动作集（allowed=true 的动作） }
        policyVersion: { type: integer }
        perAction: { type: array, items: { $ref: '#/components/schemas/EffectivePermission' }, description: 七枚资源动作逐一判定 }

    # ----- M2 departments -----
    Dept:
      type: object
      properties:
        id: { type: string }
        workspaceId: { type: string, example: ws_default }
        parentId: { type: string, nullable: true }
        path: { type: string, example: "/dept_a/dept_b/" }
        name: { type: string }
        ord: { type: integer }
        status: { type: string, example: active }
        memberCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, nullable: true }
    DeptCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        parentId: { type: string, nullable: true }
        ord: { type: integer }
    DeptUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        ord: { type: integer }
        parentId: { type: string, nullable: true, description: 变化则触发子树 path 事务重写 }

    # ----- M2 members -----
    OrgMember:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [INVITED, ACTIVE, DISABLED] }
        avatarUrl: { type: string, nullable: true }
        invitedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        deptMemberships:
          type: array
          items:
            type: object
            required: [departmentId, isMain, joinedAt]
            properties:
              departmentId: { type: string }
              isMain: { type: boolean }
              joinedAt: { type: string, format: date-time }
        directRoles:
          type: array
          items:
            type: object
            properties:
              roleId: { type: string }
              systemKey: { type: string, nullable: true, enum: [owner, creator, editor, commenter, viewer] }
              name: { type: string }
    MemberPage:
      type: object
      required: [items, total, page, limit, hasMore]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OrgMember' } }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        hasMore: { type: boolean }
    MemberInvite:
      type: object
      required: [email, displayName]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1, maxLength: 60 }
    MemberInviteResult:
      type: object
      properties:
        userId: { type: string }
        email: { type: string }
        status: { type: string, example: INVITED }
        inviteToken: { type: string, description: 明文一次性激活码（64 hex），仅本次返回 }
    MemberCreate:
      type: object
      required: [email, displayName, password]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1, maxLength: 60 }
        password: { type: string, minLength: 8, maxLength: 72 }
    DeptAssign:
      type: object
      properties:
        add: { type: array, items: { type: string } }
        remove: { type: array, items: { type: string } }
        mainDeptId: { type: string, nullable: true }
    DeptMembershipResult:
      type: object
      properties:
        userId: { type: string }
        deptMemberships:
          type: array
          items:
            type: object
            required: [departmentId, isMain, joinedAt]
            properties:
              departmentId: { type: string }
              isMain: { type: boolean }
              joinedAt: { type: string, format: date-time }
    InviteAccept:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 8, maxLength: 72 }
        displayName: { type: string, maxLength: 60 }
    AuthResult:
      type: object
      properties:
        token: { type: string, description: 带 tv claim 的 JWT }
        user:
          type: object
          properties:
            id: { type: string }
            email: { type: string }
            displayName: { type: string }
            status: { type: string, enum: [ACTIVE] }
    LifecycleResult:
      type: object
      required: [id, status, disabledAt, tokenVersion]
      properties:
        id: { type: string }
        status: { type: string, enum: [INVITED, ACTIVE, DISABLED] }
        disabledAt: { type: string, format: date-time, nullable: true }
        tokenVersion: { type: integer }

    # ----- M2 roles -----
    OrgRole:
      type: object
      properties:
        id: { type: string }
        workspaceId: { type: string }
        systemKey: { type: string, nullable: true, enum: [owner, creator, editor, commenter, viewer] }
        name: { type: string }
        description: { type: string }
        isSystem: { type: boolean }
        actions:
          type: array
          items: { type: string, enum: [manage_departments, manage_members, manage_roles, manage_menu, manage_share] }
        createdAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
    RoleCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 200 }
        actions:
          type: array
          items: { type: string, enum: [manage_departments, manage_members, manage_roles, manage_menu, manage_share] }
    RoleUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 60, description: 系统角色传该字段 -> 405 }
        description: { type: string, maxLength: 200, description: 系统角色仅此字段可改 }
        actions:
          type: array
          items: { type: string, enum: [manage_departments, manage_members, manage_roles, manage_menu, manage_share] }
    RoleAssignment:
      type: object
      properties:
        id: { type: string }
        roleId: { type: string }
        subjectType: { type: string, enum: [user, dept] }
        subjectId: { type: string }
        scopeType: { type: string, enum: [workspace] }
        scopeNodeId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, nullable: true }
    AssignmentSubject:
      type: object
      required: [subjectType, subjectId]
      properties:
        subjectType: { type: string, enum: [user, dept] }
        subjectId: { type: string }
    AssignmentReplace:
      type: object
      required: [subjects]
      properties:
        subjects:
          type: array
          items: { $ref: '#/components/schemas/AssignmentSubject' }
      description: 批量主体集；作用域固定 workspace，传 nodeId/scopeType!=workspace -> 400
    AssignmentReplaceResult:
      type: object
      properties:
        assignments:
          type: array
          items: { $ref: '#/components/schemas/RoleAssignment' }
        added:
          type: array
          items:
            type: object
            properties:
              subjectType: { type: string }
              subjectId: { type: string }
        removed:
          type: array
          items:
            type: object
            properties:
              subjectType: { type: string }
              subjectId: { type: string }
    EffectiveRole:
      type: object
      properties:
        roleId: { type: string }
        systemKey: { type: string, nullable: true, enum: [owner, creator, editor, commenter, viewer] }
        name: { type: string }
        isSystem: { type: boolean }
        actions:
          type: array
          items: { type: string, enum: [manage_departments, manage_members, manage_roles, manage_menu, manage_share] }
        sources:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [user, dept] }
              id: { type: string }
              name: { type: string, nullable: true }
    EffectiveRoles:
      type: object
      required: [userId, roles]
      properties:
        userId: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/EffectiveRole' } }

    # ----- M3 nav -----
    NavNode:
      type: object
      properties:
        id: { type: string }
        workspaceId: { type: string }
        parentId: { type: string, nullable: true }
        kind: { type: string, enum: [base, kb, table, view, doc, canvas, group] }
        resourceType: { type: string, nullable: true, description: group 为 null；资源节点同 kind }
        resourceId: { type: string, nullable: true }
        name: { type: string }
        ord: { type: integer }
        path: { type: string, example: "/navgrp_x/table_y/" }
        depth: { type: integer }
        isSystem: { type: boolean }
        iconName: { type: string, nullable: true, description: null = 前端按 kind 取默认图标 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, nullable: true }
        deletedAt: { type: string, format: date-time, nullable: true }
        dimmed:
          type: boolean
          description: >-
            剪枝响应中空容器 group 对管理能力者（manage_menu/manage_share）保留时为 true（前端标灰）；
            非空容器与资源节点不含本键。
    NavTree:
      type: object
      required: [workspaceId, navVersion, items, truncated]
      properties:
        workspaceId: { type: string }
        navVersion: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/NavNode' } }
        truncated: { type: boolean, description: 响应受参数界截断而非全量；当前恒 false }
    MenuNodeSummary:
      type: object
      required: [id, kind, name, iconName, resourceType, resourceId, state]
      properties:
        id: { type: string }
        kind: { type: string, nullable: true, enum: [base, kb, table, view, doc, canvas, group], description: broken 时为 null }
        name: { type: string, description: 节点真名；别名见菜单项 label }
        iconName: { type: string, nullable: true }
        resourceType: { type: string, nullable: true }
        resourceId: { type: string, nullable: true }
        state: { type: string, enum: [alive, soft_dangling, broken] }
    MenuItem:
      type: object
      properties:
        id: { type: string }
        parentId: { type: string, nullable: true }
        type: { type: string, enum: [container, shortcut] }
        nodeId: { type: string, nullable: true, description: shortcut 指向 nav_nodes.id，可多处挂载 }
        label: { type: string, nullable: true, description: 别名；null = 展示节点真名 }
        iconName: { type: string, nullable: true }
        ord: { type: integer }
        node: { oneOf: [{ $ref: '#/components/schemas/MenuNodeSummary' }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, nullable: true }
        deletedAt: { type: string, format: date-time, nullable: true }
    MenuTree:
      type: object
      required: [workspaceId, menuVersion, items]
      properties:
        workspaceId: { type: string }
        menuVersion: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/MenuItem' } }
    MenuChangeRequest:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              op: { type: string, enum: [insert, update, reorder, delete] }
              id: { type: string, description: insert 可由客户端指定合法 id；update/reorder/delete 定位项 }
              type: { type: string, enum: [container, shortcut], description: 仅 insert }
              parentId: { type: string, nullable: true, description: insert/reorder 用 }
              nodeId: { type: string, nullable: true, description: insert shortcut 必须带活节点 }
              label: { type: string, nullable: true, description: insert/update 别名 }
              iconName: { type: string, nullable: true, description: 白名单 NAV_ICONS }
              ord: { type: integer }
    MenuChangeResult:
      type: object
      required: [menuVersion, applied, itemIds]
      properties:
        menuVersion: { type: integer }
        applied: { type: integer }
        itemIds: { type: array, items: { type: string } }
    GroupCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        parentId: { type: string, nullable: true, description: 父只能是活 group 或 null；根层用 root 或省略 }
        ord: { type: integer }
        iconName: { type: string, nullable: true }
    GroupUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 60 }
        ord: { type: integer }
    GroupDeleteResult:
      type: object
      required: [id, moved]
      properties:
        id: { type: string }
        moved: { type: integer, description: strategy=move 时迁走的直接子节点数 }
    MoveRequest:
      type: object
      required: [newParentId]
      properties:
        newParentId: { type: string, description: 目标 group id；移根层用 root }
        confirmed: { type: boolean, description: 未带或 false -> 409 MOVE_NEEDS_CONFIRM 带 impact }
    MoveImpact:
      type: object
      required: [nodeId, newParentId, subtreeItemCount, affectedUserCount, shortcutCount, willBreakInheritanceHint]
      properties:
        nodeId: { type: string }
        newParentId: { type: string, description: 根层序列化为空串 }
        subtreeItemCount: { type: integer, description: 子树内 table/doc/canvas 数（不含 view/group） }
        affectedUserCount:
          type: integer
          description: >-
            M4/S7 三源口径：移动前后对子树资源节点 r 可见集（direct/dept/role 展开 + ACTIVE 收敛，
            不含行级谓词 A-7）的对称差去重人数。
        shortcutCount: { type: integer }
        willBreakInheritanceHint:
          type: boolean
          description: M4/S7 真值——子树某资源节点最近 inheritAncestors=0 祖先移动前后是否不同
    MoveConfirmError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            impact: { $ref: '#/components/schemas/MoveImpact' }

    # ----- M4/S7 中断继承 -----
    InheritanceImpactItem:
      type: object
      required: [userId, name, via, sources]
      properties:
        userId: { type: string }
        name: { type: string, nullable: true }
        via: { type: string, enum: [direct, dept, role] }
        sources: { type: array, items: { type: string }, description: 命中来源标注（direct/dept/role + 节点） }
    InheritanceExemptItem:
      type: object
      required: [userId, name, reason]
      properties:
        userId: { type: string }
        name: { type: string, nullable: true }
        reason: { type: string, enum: [creator, workspace_owner] }
    InheritanceImpact:
      type: object
      required: [nodeId, from, to, delta, count, items, limit, offset, exempt]
      description: >-
        中断/恢复继承的失访（losing）或恢复（gaining）预览。本载荷不含 willBreakInheritanceHint——
        "是否跨越 restricted 边界"的提示只属于 MoveImpact（移动语义）；继承切换的目标即显式 0/1，
        边界状态由 from/to 表达。人数不含行级谓词（A-7 顺延 P1）。
      properties:
        nodeId: { type: string }
        from: { type: boolean }
        to: { type: boolean }
        delta: { type: string, enum: [losing, gaining] }
        count: { type: integer, description: 精确失访/恢复人数（COUNT DISTINCT，不受分页影响） }
        items:
          type: array
          items: { $ref: '#/components/schemas/InheritanceImpactItem' }
        limit: { type: integer }
        offset: { type: integer }
        exempt:
          type: array
          items: { $ref: '#/components/schemas/InheritanceExemptItem' }
    InheritancePatchRequest:
      type: object
      required: [value]
      properties:
        value: { type: boolean, description: false=中断继承（置 0），true=恢复 }
        confirmed: { type: boolean, description: 未带或 false -> 409 INHERITANCE_CONFIRM_REQUIRED 回带 impact }
    InheritanceChangeResult:
      allOf:
        - type: object
          required: [nodeId, inheritAncestors, navVersion, policyVersion]
          properties:
            nodeId: { type: string }
            inheritAncestors: { type: boolean }
            navVersion: { type: integer }
            policyVersion: { type: integer }
        - type: object
          required: [impact]
          properties:
            impact: { $ref: '#/components/schemas/InheritanceImpact' }
    InheritanceConfirmError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            impact: { $ref: '#/components/schemas/InheritanceImpact' }
    BreadcrumbNode:
      type: object
      required: [id, parentId, kind, resourceType, resourceId, name, path, depth]
      properties:
        id: { type: string }
        parentId: { type: string, nullable: true }
        kind: { type: string, enum: [base, kb, table, view, doc, canvas, group] }
        resourceType: { type: string, nullable: true }
        resourceId: { type: string, nullable: true }
        name: { type: string }
        path: { type: string }
        depth: { type: integer }
    NodeBreadcrumb:
      type: object
      required: [nodeId, chain, truncatedAbove]
      properties:
        nodeId: { type: string }
        chain:
          type: array
          description: 从该用户有权的最高祖先到自身的连续可见段（根->自身序）；不含无权祖先 id/name/path
          items: { $ref: '#/components/schemas/BreadcrumbNode' }
        truncatedAbove: { type: boolean, description: 链起点之上是否存在被中性截断的无权祖先段 }
    # ---------------- M5/S9 统一检索管理面 ----------------
    SearchApiKeyStatus:
      type: object
      required: [configured, source, maskedLast4]
      properties:
        configured: { type: boolean, description: 当前是否存在可用嵌入 API key（db 密文优先，否则 env） }
        source: { type: string, enum: [env, db, none] }
        maskedLast4: { type: string, nullable: true, description: 仅末 4 位；无 key 为 null，绝不回明文 }
    EmbeddingConfig:
      type: object
      required: [mode, provider, baseURL, model, dim, dimOverride, dimEditable, batchSize, timeoutMs, fieldChunkCap, concurrency, retryMaxAttempts, retryBaseMs, apiKey, searchGate]
      properties:
        mode: { type: string, enum: [off, cloud] }
        provider: { type: string, enum: [cloud, openai-compatible, self-hosted], description: 远端服务形态；旧库无此键按 cloud 处理 }
        baseURL: { type: string }
        model: { type: string }
        dim: { type: integer, description: 现役 search.db vec_chunks 建表维度；未建库/未向量化为 0 }
        dimOverride: { type: integer, description: 手动指定维度；0=未指定（沿用 model 元数据）。仅自建/兼容档可写 }
        dimEditable: { type: boolean, description: 当前服务形态是否允许手动指定维度 }
        batchSize: { type: integer }
        timeoutMs: { type: integer }
        fieldChunkCap: { type: integer, minimum: 1, maximum: 1000 }
        concurrency: { type: integer, minimum: 1, maximum: 64, description: 单批在飞远端请求并发上限，真的喂给 provider 信号量 }
        retryMaxAttempts: { type: integer, minimum: 1, maximum: 10, description: 单请求最大尝试次数（首次+退避重试） }
        retryBaseMs: { type: integer, minimum: 1, maximum: 600000, description: 重试指数退避基数（毫秒） }
        apiKey: { $ref: '#/components/schemas/SearchApiKeyStatus' }
        searchGate: { $ref: '#/components/schemas/SearchGate' }
    SearchGate:
      type: object
      required: [envValue, override, effective, queryAvailable, envGateOff, workerNeedsRestart]
      properties:
        envValue: { type: string, enum: [off, shadow, on], description: 启动期由 GX_M5_SEARCH 解析，决定路由是否挂载，运行期不可改 }
        override: { type: string, enum: [on, off, inherit], description: app_settings 的 search.enabled 覆盖值 }
        effective: { type: string, enum: [off, shadow, on], description: 覆盖后解析出的目标态 }
        queryAvailable: { type: boolean, description: 检索接口当前是否真的对外可用（已挂载且目标态非 off） }
        envGateOff: { type: boolean, description: env=off 时路由未挂载，覆盖键此时无法启用检索，须改 env 并重启 }
        workerNeedsRestart: { type: boolean, description: 索引 worker 启动期决定是否起，覆盖值恒需重启生效 }
    EmbeddingConnectionTestResult:
      type: object
      required: [ok, latencyMs, dim, detail, errorKind]
      properties:
        ok: { type: boolean }
        latencyMs: { type: integer }
        dim: { type: integer, nullable: true, description: 探测到的向量维度；未成功为 null }
        detail: { type: string, description: 中性结论（含失败类别的中文说明，绝不回显密钥） }
        errorKind: { type: string, nullable: true, description: "auth/server/timeout/network/client/config；成功为 null" }
    EmbeddingConfigPatchResult:
      allOf:
        - $ref: '#/components/schemas/EmbeddingConfig'
        - type: object
          required: [reindexRequired]
          properties:
            reindexRequired: { type: boolean, description: mode/model/fieldChunkCap 变更后置 true；不自动重建，须显式 reindex }
    SearchCoverage:
      type: object
      required: [a, b, c, d, e, f]
      properties:
        a: { type: integer, description: 活实体无 chunk（漏索引，阻断） }
        b: { type: integer, description: chunk 实体不存在/已删（脏行，阻断） }
        c: { type: integer, description: nodeId 悬空（警告，可自愈） }
        d: { type: integer, description: cloud 下 chunk 缺 vec（向量欠账，警告；off 不适用） }
        e: { type: integer, description: chunk 缺 fts 行（阻断） }
        f: { type: integer, description: field chunk 缺 field_grant（授权漏登，阻断） }
    SearchIndexStatus:
      type: object
      required: [schemaVersion, indexedAt, chunks, backlog, coverage, rebuilding]
      properties:
        schemaVersion: { type: integer }
        indexedAt: { type: string, nullable: true, format: date-time }
        chunks:
          type: object
          required: [records, docs, canvas, total, fieldChunks, fieldChunksCapped, fieldChunkCap]
          properties:
            records: { type: integer }
            docs: { type: integer }
            canvas: { type: integer }
            total: { type: integer }
            fieldChunks: { type: integer }
            fieldChunksCapped: { type: integer, description: 超 N 截断记录数（index_meta.capped_records） }
            fieldChunkCap: { type: integer }
        backlog:
          type: object
          required: [pending, failed, dead]
          properties:
            pending: { type: integer, description: pending+processing }
            failed: { type: integer }
            dead: { type: integer }
        coverage: { $ref: '#/components/schemas/SearchCoverage' }
        rebuilding: { type: boolean }
    SearchStatus:
      type: object
      required: [vec, embedding, index]
      properties:
        vec:
          type: object
          required: [loaded, version, extPathKind]
          properties:
            loaded: { type: boolean }
            version: { type: string, nullable: true }
            extPathKind: { type: string, enum: [builtin, env-override, platform] }
        embedding:
          type: object
          required: [mode, model, dim, healthy, reindexRequired]
          properties:
            mode: { type: string, enum: [off, cloud] }
            model: { type: string }
            dim: { type: integer }
            healthy: { type: boolean }
            detail: { type: string, description: 健康/失败中性细节（技术态，不含凭据） }
            reindexRequired: { type: boolean }
        index: { allOf: [{ $ref: '#/components/schemas/SearchIndexStatus' }], nullable: true, description: search.db 尚未建库为 null }
    ReindexStarted:
      type: object
      required: [job, status]
      properties:
        job: { type: string, enum: [reindex] }
        status: { type: string, enum: [started] }
    ReindexRequest:
      type: object
      properties:
        type: { type: string, enum: [record, doc, canvas], description: 单实体重建的实体族；省略=全量 }
        entityId: { type: string, description: 给定时对该实体原地幂等重建；省略=全量双库原子切换 }
    EmbeddingConfigPatch:
      type: object
      properties:
        mode: { type: string, enum: [off, cloud] }
        provider: { type: string, enum: [cloud, openai-compatible, self-hosted] }
        baseURL: { type: string, description: 必须是 http(s) URL }
        model: { type: string }
        dim: { type: integer, minimum: 1, maximum: 4096, description: 仅 openai-compatible / self-hosted 接受；cloud 档出现即 400 }
        batchSize: { type: integer, minimum: 1 }
        timeoutMs: { type: integer, minimum: 1 }
        fieldChunkCap: { type: integer, minimum: 1, maximum: 1000 }
        concurrency: { type: integer, minimum: 1, maximum: 64 }
        retryMaxAttempts: { type: integer, minimum: 1, maximum: 10 }
        retryBaseMs: { type: integer, minimum: 1, maximum: 600000 }
        searchEnabled: { type: string, enum: [on, off, inherit], description: 检索总门 db 覆盖；索引 worker 需重启生效 }
        confirmCloud: { type: boolean, description: off->cloud 必须显式 true，否则 409 NEED_CLOUD_CONFIRM }
        apiKey:
          type: string
          nullable: true
          description: 字符串=AES-GCM 覆盖落库；字段缺省=保持；显式 null=清除 db key
      description: >-
        禁止出现 reindex 字段（出现即 400 EMBEDDING_CONFIG_INVALID）。dim 仅在服务形态为
        openai-compatible / self-hosted 时接受，cloud 档维度由 model 元数据决定、出现即 400。
        apiKey 不会在任何响应回明文。
    ApiKeyRotateRequest:
      type: object
      required: [apiKey]
      properties:
        apiKey: { type: string, description: 非空字符串，AES-GCM 加密落库 }

    # ----- M6/S9 鉴权 MCP 面：PAT 管理（/api/v1/pats） -----
    PatScope:
      type: string
      enum: [record:read, record:write, doc:read, doc:write, canvas:read, canvas:write]
      description: >-
        PAT 作用域六位（创建时的粗筛闸门一：无 record:write 则写工具不入册）。
        作用域只做族级粗筛，资源级与字段级判定归 M4 权限引擎，令牌不携带任何资源授权。
    PatCreateRequest:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, maxLength: 60, description: 令牌备注名（去首尾空白后非空，长度上限 60） }
        scopes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PatScope' }
          description: 六位子集，非空；重复项去重；空数组或含未知位即 400 PAT_SCOPE_INVALID
        expiresInDays:
          type: integer
          nullable: true
          enum: [30, 90, 365, null]
          description: 30/90/365 天，或显式 null 表示永不过期；键缺省时取默认 90 天；其余取值 400 PAT_EXPIRY_INVALID
    PatCreateResponse:
      type: object
      required: [id, name, scopes, token, tokenPrefix, expiresAt, createdAt]
      properties:
        id: { type: string, description: 令牌行 id（吊销时用它，不用明文） }
        name: { type: string }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/PatScope' }
        token:
          type: string
          description: >-
            完整 PAT 明文（gxpat_ 起头 + 24 字节随机 base64url）。
            仅创建响应返回这一次；之后任何端点、列表、审计、日志均不再出现，服务端只存 sha256 摘要。
        tokenPrefix: { type: string, description: 明文前 14 字符（gxpat_ 加 8 随机字符），仅供列表辨识，不足以反推令牌 }
        expiresAt: { type: string, format: date-time, nullable: true, description: null 表示永不过期 }
        createdAt: { type: string, format: date-time }
      description: 创建响应不含 revokedAt/lastUsedAt（新令牌尚无这两项状态），列表用 PatMetadata。
    PatMetadata:
      type: object
      required: [id, name, tokenPrefix, scopes, expiresAt, revokedAt, lastUsedAt, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        tokenPrefix: { type: string, description: 前 14 字符；响应绝不含 token 或 tokenHash }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/PatScope' }
        expiresAt: { type: string, format: date-time, nullable: true }
        revokedAt:
          type: string
          format: date-time
          nullable: true
          description: 非空即已吊销（软吊销，不物删行）；该令牌的下一次 /mcp 请求即 401
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: 最近一次经 /mcp 成功认证的时间；进程内按 patId 节流 60 秒落库，可能滞后
        createdAt: { type: string, format: date-time }
    PatList:
      type: array
      description: 本人全部 PAT 元数据（按 createdAt 降序；仅本人行，不 join 任何关系）
      items: { $ref: '#/components/schemas/PatMetadata' }

security:
  - bearerAuth: []

paths:
  /meta:
    get:
      tags: [meta]
      summary: v1 探针，返回当前登录主体组织态（GX_ENTERPRISE_ORG 开启时）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/invite/accept:
    post:
      tags: [auth-invite]
      summary: 接受邀请（公开，不要求登录），一次性激活码兑换 ACTIVE 与 JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteAccept' }
      responses:
        '200':
          description: 激活成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: 激活码无效或已被使用（重放同码），统一 404 避免账号枚举
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/Conflict' }

  /authz/visible-scope:
    get:
      tags: [authz]
      summary: |
        M4/S4 权限引擎只读探针：返回目标用户在预算内可见的 nav 节点集（M5 先收敛后召回的契约面）。
        直接由引擎在 auth_policies/nav_nodes 上批量计算，
        与逐节点 decide 共用同一判定内核（零分叉）。
      description: |
        - 默认查本人（供前端"无权列表"诊断）；显式传 userId 查他人是工作区级排障，
          要求调用方持工作区 role_owner（manage_share 的工作区兜底形态），否则 403（fail-closed）。
        - 多动作取并：节点对任一动作可见即纳入；非法动作 token 返回 400（不静默忽略）。
        - budget 默认 5000、硬上限 20000；截断或结果超 499 节点时 materialize=temp_table，
          M5 必须物化为 search.db 临时表，禁止超长 IN 直拼。
      parameters:
        - name: userId
          in: query
          required: false
          schema: { type: string }
          description: 目标用户 id；缺省/空白为本人；查他人需工作区 owner
        - name: actions
          in: query
          required: false
          schema: { type: string, default: 'r' }
          description: 逗号分隔资源动作（r/c/u/d/comment/manage_share/manage_schema/enter/edit_data；enter=库门准入仅 base/kb、edit_data=库内可写并集仅 base/kb，两枚均为投影派生位不可手工授予），默认 r
        - name: kinds
          in: query
          required: false
          schema: { type: string }
          description: 逗号分隔资源类型白名单（base/kb/table/view/doc/canvas/group）；未知值忽略，缺省全部
        - name: budget
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 5000 }
          description: 可见节点预算；非正整数 400；超 20000 收敛到 20000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisibleScope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /org/departments:
    get:
      tags: [departments]
      summary: 平铺列全部活部门（含 memberCount），树组装在前端
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Dept' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [departments]
      summary: 建部门（需 manage_departments）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeptCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dept' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /org/departments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [departments]
      summary: 改名/排序/移动（parentId 变化触发子树 path 重写、防环、32 层护栏）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeptUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dept' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [departments]
      summary: 软删（有子部门或成员 -> 409）
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id: { type: string }
                  deleted: { type: boolean, example: true }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /org/members:
    get:
      tags: [members]
      summary: 成员目录（登录全员可读），分页/q/deptId 含子树/status
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: q, in: query, schema: { type: string }, description: email/displayName 模糊（参数化 LIKE） }
        - { name: deptId, in: query, schema: { type: string }, description: 含该部门整棵子树 }
        - { name: status, in: query, schema: { type: string, enum: [INVITED, ACTIVE, DISABLED] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [members]
      summary: 管理员直接建 ACTIVE 账号（需 manage_members）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { type: string }
                  email: { type: string }
                  status: { type: string, example: ACTIVE }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /org/members/invite:
    post:
      tags: [members]
      summary: 邀请建 INVITED 账号（需 manage_members），明文激活码仅返一次
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberInvite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberInviteResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /org/members/me/effective-roles:
    get:
      tags: [members]
      summary: 当前登录者有效组织角色（直接授予 ∪ 活部门祖先闭包，附来源）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveRoles' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /org/members/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [members]
      summary: 成员详情（含活部门归属与直接角色）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /org/members/{id}/effective-roles:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [members]
      summary: 指定成员有效组织角色（求值为常量查询，调岗/兼岗下一次请求即变）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveRoles' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /org/members/{id}/departments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [members]
      summary: 增量调岗/兼岗/设主部门（需 manage_members）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeptAssign' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeptMembershipResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /org/members/{id}/disable:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [members]
      summary: 停用成员（需 manage_members；自停用 400、最后 owner 409）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LifecycleResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /org/members/{id}/reactivate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [members]
      summary: 重新激活（需 manage_members；旧 token 仍失效，强制重登）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LifecycleResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /org/roles:
    get:
      tags: [roles]
      summary: 列角色（系统角色固定序在前，自定义随后）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrgRole' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [roles]
      summary: 建自定义角色（需 manage_roles），actions 走四枚动作白名单
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgRole' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /org/roles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [roles]
      summary: 改角色（系统角色仅 description，其余 405）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgRole' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [roles]
      summary: 软删自定义角色（有悬挂授予 -> 409；?reassignTo= 迁移后删；系统角色 405）
      parameters:
        - { name: reassignTo, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id: { type: string }
                  deleted: { type: boolean, example: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }

  /org/roles/{id}/assignments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [roles]
      summary: 列角色授予
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleAssignment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [roles]
      summary: 批量替换主体集（事务 diff 授予/撤销；需 manage_roles）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentReplace' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentReplaceResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/current/tree:
    get:
      tags: [workspaces]
      summary: 权威资源树读（平铺 + parentId，前端组树）
      parameters:
        - { name: parentId, in: query, required: false, schema: { type: string }, description: 省略=根层；root=根层；具体 id=锚点子树 }
        - { name: maxDepth, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10, default: 2 } }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [base, kb, table, view, doc, canvas, group] } }
        - { name: all, in: query, required: false, schema: { type: string, enum: ['1', 'true'] }, description: 管理全量，仅组织管理员，含软删并绕过分块 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NavTree' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /workspaces/current/menu:
    get:
      tags: [workspaces]
      summary: 菜单引用树 + shortcut 节点摘要（state 三态）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuTree' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [workspaces]
      summary: 菜单批量 diff 单事务（需 manage_menu），整单成功或 4xx 全拒
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuChangeRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuChangeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /nav/groups:
    post:
      tags: [nav-groups]
      summary: 建 group 节点（需 manage_menu）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /nav/groups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [nav-groups]
      summary: 改名/排序（需 manage_menu）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [nav-groups]
      summary: 删组（需 manage_menu），strategy=move|retain；缺省且非空 409
      parameters:
        - { name: strategy, in: query, required: false, schema: { type: string, enum: [move, retain] } }
        - { name: targetParentId, in: query, required: false, schema: { type: string }, description: strategy=move 必填，另一活 group }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDeleteResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /nodes/{id}/move-impact:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [nodes]
      summary: 移动影响预览（需 manage_menu），旧成员口径
      parameters:
        - { name: newParentId, in: query, required: true, schema: { type: string }, description: 目标 group；根层用 root }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveImpact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /nodes/{id}/move:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [nodes]
      summary: 执行移动（需 manage_menu）；未 confirmed -> 409 MOVE_NEEDS_CONFIRM 带 impact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, newParentId]
                properties:
                  id: { type: string }
                  newParentId: { type: string, nullable: true, description: 根层为 null }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 需确认影响面（MOVE_NEEDS_CONFIRM），回带 impact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveConfirmError' }

  /nodes/{id}/policies:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: nav 节点 id }
    get:
      tags: [nodes]
      summary: 列节点直接授权策略 + cutoff 内祖先只读继承摘要（读需对节点有 r）
      description: |
        管理视角：返回节点全部直接策略行（不限主体，解析出 subjectName/subjectType），
        以及按继承 cutoff 收集的、会向下作用到本节点的祖先策略只读摘要。
        鉴权：调用方对该节点 decide(r) 通过（workspace owner / 实体 creator 兜底已含），否则 403。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodePoliciesView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 对节点无 r（已认证但无权本资源；REST 回落泛 FORBIDDEN，FORBIDDEN_RESOURCE 词汇留待 M6 MCP）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [nodes]
      summary: 单事务整单写节点策略（需组织 manage_share 或节点资源 manage_share）
      description: |
        整单 upserts/deletes，全合法才提交（任一不合法 4xx 全拒，policyVersion 不增）：
        动作白名单（r/c/u/d/comment/manage_share/manage_schema/enter/edit_data）、节点存在非软删、edit_data 不接受手工授予（仅 scope 投影派生）、
        kind-动作合法（manage_schema 仅 table/base）、fieldMask 字段必须属于该 table、主体存在不悬挂。
        成功 bump workspaces.policyVersion 并审计 policy_changed（detail 带 before/after diff）。
        可映射到旧三表角色档的 per-user 授权同事务反写 members/kb_members/kb_doc_acls；
        不可映射（角色/部门授予、fieldMask、非标动作组合、无旧表节点类型）不阻断、不扩旧表，
        在 200 响应中以 legacyUnmappable 明细返回。legacyUnmappable 不是错误码。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyWriteRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyWriteResult' }
        '400':
          description: >-
            整单校验失败（全拒、policyVersion 不增）：POLICY_BAD_INPUT / POLICY_SUBJECT_INVALID /
            POLICY_ACTION_INVALID / POLICY_FIELD_INVALID；P1 行级条件非 null 时 POLICY_CONDITION_UNSUPPORTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: 节点不存在（PolicyValidationError POLICY_NODE_NOT_FOUND 原样透传，HTTP 404）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 编排节点（group）挂资源策略等 kind 冲突（POLICY_NODE_KIND_INVALID）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /nodes/{id}/effective:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: nav 节点 id }
    get:
      tags: [nodes]
      summary: 决策解释器：某用户在节点的最终动作集 + 每动作完整来源链（读需 r；查他人需 manage_share）
      parameters:
        - { name: userId, in: query, required: false, schema: { type: string }, description: 目标用户；缺省为本人，查他人需写授权 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /nodes/{id}/inheritance/impact:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: doc/canvas 活 nav 节点 id }
    get:
      tags: [nodes]
      summary: 中断/恢复继承影响预览（需组织或节点 manage_share）
      description: |
        三源（direct/dept/role）展开 cutoff 链上含 r 授予，关后可见集 = 节点自身授予 ∪ creator ∪
        workspace owner；losing/gaining 对称，多部门只计 1，人数不含行级谓词（A-7）。
        count 精确，items 按 userId 字典序分页；creator/workspace owner 列入 exempt 不计 count。
      parameters:
        - { name: value, in: query, required: false, schema: { type: string, enum: ['0', '1', 'true', 'false'] }, description: 目标值；缺省 = 切换到当前值反面 }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 100, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InheritanceImpact' }
        '400':
          description: 非 doc/canvas 叶子（NODE_NOT_INHERITABLE）或参数非法
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /nodes/{id}/inheritance:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: doc/canvas 活 nav 节点 id }
    patch:
      tags: [nodes]
      summary: 中断/恢复继承（需组织或节点 manage_share）；未 confirmed -> 409 带 impact
      description: |
        成功后同事务置 inheritAncestors 并 bump navVersion 与 policyVersion，审计 inheritance_changed。
        目标值与现状一致时幂等返回（count=0，不 bump、不审计）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InheritancePatchRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InheritanceChangeResult' }
        '400':
          description: 非 doc/canvas 叶子（NODE_NOT_INHERITABLE）或请求体非法
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 未确认（INHERITANCE_CONFIRM_REQUIRED），回带 impact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InheritanceConfirmError' }

  /nodes/{id}/breadcrumb:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: 任意活 nav 节点 id }
    get:
      tags: [nodes]
      summary: 节点面包屑（A-6 防泄漏）：只返回从该用户有权最高祖先起的连续可见段
      description: |
        无权祖先段整体中性截断（truncatedAbove=true），响应不含被截段的 id/name/path。
        group 为透明容器；节点自身无 r -> 403；不存在/软删 -> 404。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeBreadcrumb' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ================= M5/S9 统一检索管理面（仅 GX_M5_SEARCH on/shadow 挂载；off 全 404） =================
  /admin/reindex:
    post:
      tags: [search-admin]
      summary: 触发重建索引（role_owner；异步，立即 202）
      description: |
        省略 entityId=全量重建：写到独立 search.db.rebuild-&lt;ts&gt;，灌完 POSIX rename 原子替换，
        旧库持续服务，切换瞬态只读连接重开。给 entityId=对该实体在现役库原地幂等 applyUpsert。
        进行中再次调用 -> 409 REINDEX_IN_PROGRESS。不随配置变更自动触发。
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReindexRequest' }
      responses:
        '202':
          description: 重建已开始
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReindexStarted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 已有重建在进行（code=REINDEX_IN_PROGRESS）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /admin/search/status:
    get:
      tags: [search-admin]
      summary: 检索子系统状态（vec/embedding/index/coverage/backlog，role_owner）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/embedding/config:
    get:
      tags: [search-admin]
      summary: 读嵌入配置（apiKey 仅存在性 + 末 4，role_owner）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbeddingConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [search-admin]
      summary: 改嵌入配置（两步：不自动重建，role_owner）
      description: |
        出现 dim/dimensions 或 reindex 字段 -> 400 EMBEDDING_CONFIG_INVALID；
        off->cloud 须 confirmCloud:true，否则 409 NEED_CLOUD_CONFIRM（cloud->off 不需确认）；
        apiKey 字符串=加密覆盖、缺省=保持、null=清 db key；fieldChunkCap 1..1000；baseURL 须 http(s)；
        batchSize/timeoutMs 正整数。mode/model/fieldChunkCap 变更 -> reindexRequired:true，不自动重建。
        JWT_SECRET 轮换致旧密文不可解 -> apiKey.configured:false/source:none，不 500。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmbeddingConfigPatch' }
      responses:
        '200':
          description: OK（含 reindexRequired）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbeddingConfigPatchResult' }
        '400':
          description: 配置非法（code=EMBEDDING_CONFIG_INVALID）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 缺云端二次确认（code=NEED_CLOUD_CONFIRM）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /admin/embedding/test-connection:
    post:
      tags: [search-admin]
      summary: 嵌入服务连通性自检（按已保存配置探活，不落库、不回凭据，role_owner）
      description: |
        只发一次真实请求（并发 1、不重试、超时钳到 8s），绝不写任何配置、绝不回显密钥。
        未启用/配置不完整直接回 ok:false（errorKind=config），不触网。
      responses:
        '200':
          description: OK（失败也是 200：结论写在本体 ok 字段里）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbeddingConnectionTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/embedding/api-key/rotate:
    post:
      tags: [search-admin]
      summary: 轮换嵌入 API key（AES-GCM 落库，回存在性形状，role_owner）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyRotateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchApiKeyStatus' }
        '400':
          description: apiKey 缺失/非字符串/空（code=EMBEDDING_CONFIG_INVALID）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/embedding/api-key:
    delete:
      tags: [search-admin]
      summary: 清除 db 嵌入 API key（随后回落 env 种子或 none，role_owner）
      responses:
        '204':
          description: 已清除
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  # ================= M6/S9 鉴权 MCP 面 REST 段（随 GX_ENTERPRISE_ORG 挂载；off 全 404） =================
  # 完整路径为 /api/v1/pats（servers[0].url 已含 /api/v1，故此处写相对路径，与上方各段一致）。
  # 创建/删除走独立敏感档（默认 30 次/60 秒/人）；GET 只读列表不设该档，由全局 /api 兜底档覆盖。
  /pats:
    get:
      tags: [pats]
      summary: 列出本人全部 PAT 元数据（绝不返回 token / tokenHash）
      description: |
        仅返回调用者本人创建的令牌（userId 过滤，一次 findMany 按 createdAt 降序，不 join 关系以防 N+1）。
        已吊销/已过期/未使用的令牌均在列表中，用 revokedAt / expiresAt / lastUsedAt 区分状态。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [pats]
      summary: 创建 PAT，明文仅此一次返回（独立敏感档限流）
      description: |
        校验通过后落库并回明文一次。审计事件 mcp_pat_create，detail 只含 patId / name / prefix / scopes / expiresAt；
        prefix 为 14 字符不可认证段，完整明文绝不落库、不落日志、不入审计。
        超限时 429 code=MCP_RATE_LIMITED，附 Retry-After 与 X-RateLimit-*（窗口内每次调用都回 X-RateLimit-*，便于客户端自适应）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatCreateRequest' }
      responses:
        '201':
          description: 已创建（token 仅本响应可见）
          headers:
            X-RateLimit-Limit:
              description: 本窗口配额上限（默认 30）
              schema: { type: integer, example: 30 }
            X-RateLimit-Remaining:
              description: 本窗口剩余可用次数
              schema: { type: integer, example: 29 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatCreateResponse' }
        '400':
          description: 入参校验失败（code=PAT_NAME_INVALID / PAT_SCOPE_INVALID / PAT_EXPIRY_INVALID）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/McpRateLimited' }
  /pats/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: PAT 行 id（不是明文令牌） }
    delete:
      tags: [pats]
      summary: 吊销 PAT（本人限定；非本人/不存在/已吊销统一 404，不泄漏存在性）
      description: |
        置 revokedAt 软吊销，不物删行（保留审计可追溯）。生效即时：该令牌的下一次 /mcp 请求即 401
        （每次请求重认证、无会话缓存，无需等待任何 TTL）。审计事件 mcp_pat_revoke。
        创建与删除共用同一敏感档（30 次/60 秒/人）。
      responses:
        '204':
          description: 已吊销（无响应体）
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/PatNotFound' }
        '429': { $ref: '#/components/responses/McpRateLimited' }

# ============================================================================================
# x-mcp：M6 鉴权 MCP 服务（协议面非 REST，故不进 paths；两个入口共用同一套认证/闸门/工具/审计）
# ============================================================================================
x-mcp:
  summary: M6 鉴权 MCP 服务：PAT 边缘认证 + M4 可见集闸门 + 工具语言层 + 审计四事件
  why-not-in-paths: |
    /mcp 是 JSON-RPC 2.0 over Streamable HTTP 的无状态直桥，不是 REST 资源端点：
    没有路径变量、成功也是 HTTP 200 承载业务失败、错误信封是 JSON-RPC 而不是 {error, code}。
    硬写成 paths 条目会伪造 REST 语义，故以扩展键表达；REST 部分（PAT 管理）仍在上方 /pats 正常表达。
  spec-ref: >-
    docs/_archive/originals/planning-phase2-M6-implementation-plan.md（§4.1 中间件序、§4.3 认证口径、
    §4.5 工具契约、§5.3 限流双键、§6 错误码只增）。
    出口证据见 docs/baseline/m6-connectivity.md；运维处置见 docs/runbooks/mcp.md；
    接入说明见 docs/guides/mcp-client-onboarding.md。
  gate: >-
    随 GX_ENTERPRISE_ORG 门控（与 /api/v1/pats 同门控，C-5 定稿）：off 时 /mcp 不挂载，
    请求落到顶层 404 NOT_FOUND（不是 401，这一差异用于区分"未升级"与"未认证"）。
  auth:
    header: 'Authorization: Bearer <PAT 明文>'
    scheme: >-
      本期仅 Bearer PAT（个人访问令牌）。未来 OAuth 只在同一认证函数留"Bearer PAT 或 Bearer JWT"分支扩展点，
      不预埋端点、不预埋表。
    per-request: 每请求独立重认证，无会话信任、无会话缓存；故吊销/停用/改权限在下一次请求即生效。
    failure-response: >-
      HTTP 401，头 WWW-Authenticate: Bearer realm="gouxiangdb-mcp"，
      体 {"jsonrpc":"2.0","error":{"code":-32001,"message":<文案>},"id":null}（id 恒为 null）。
    states:
      - id: missing_bearer
        trigger: 无 Authorization 头，或值不是 Bearer 前缀
        message: Unauthorized
        distinguishable: false
      - id: not_pat_prefix
        trigger: Bearer 值缺少 gxpat_ 前缀（不查库，防令牌枚举）
        message: Unauthorized
        distinguishable: false
      - id: unknown_token
        trigger: sha256 摘要查不到该令牌（对 dummy 摘要做一次等长比较以抹平时序差异）
        message: Unauthorized
        distinguishable: false
      - id: revoked
        trigger: 令牌行 revokedAt 非空
        message: Token revoked
        distinguishable: true
      - id: expired
        trigger: 令牌行 expiresAt 已过
        message: Token expired
        distinguishable: true
      - id: account_disabled
        trigger: 令牌行有效但所属用户非 ACTIVE（C-4 纵深防御）
        message: Account disabled
        distinguishable: true
    wording: >-
      拿不出有效令牌的三种情况响应体逐字节一致；已过期 / 已吊销 / 账号停用各自可辨识。
      依据 M6 实施计划 §4.3（校验顺序）与 §4.1（边缘口径）。逐字节一致性由 e2e 对拍，
      证据见 docs/baseline/m6-connectivity.md §6。
    audit: >-
      认证失败必审计：ip + 14 字符明文前缀 + reason（前缀只用于"同一坏令牌反复尝试"的关联分析，
      不足以认证）；非 gxpat_ 形态不落任何前缀；任何情况下不落完整令牌。
  entries:
    - id: http
      transport: Streamable HTTP（stateless）
      endpoint: /mcp
      alt-endpoint: '{basePath}/mcp（子路径部署同源可达，basePath 不参与协议语义）'
      server: 由 API 进程直接提供（裸机部署经 Caddy 反代；容器部署由同一进程托管前端静态）
      notes: >-
        每请求新建 server + transport（sessionIdGenerator: undefined、enableJsonResponse: true），
        不维护会话状态；进程内单实例，与全局限流同纪律。
      request-headers:
        - 'Authorization: Bearer <PAT 明文>（必需）'
        - 'Content-Type: application/json（必需）'
        - 'Accept: application/json, text/event-stream（Streamable HTTP 客户端必需）'
      examples:
        init: |
          curl -sS -X POST https://<host>/mcp \
            -H 'Authorization: Bearer <PAT>' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"curl","version":"0"}}}'
        tools-list: |
          curl -sS -X POST https://<host>/mcp \
            -H 'Authorization: Bearer <PAT>' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
        tool-call: |
          curl -sS -X POST https://<host>/mcp \
            -H 'Authorization: Bearer <PAT>' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"ping_echo","arguments":{"text":"hi"}}}'
    - id: stdio
      transport: stdio（本地子进程；随发布包投递的同一个产物，不常驻服务、不占端口、不碰 HTTP 监听）
      command: 'GX_MCP_TOKEN=<PAT 明文> node dist/mcp-stdio.js'
      bin-entry: >-
        apps/api/package.json 的 bin.gx-mcp-stdio 指向 ./dist/mcp-stdio.js；
        但 docker/fpk 产出的精简运行时 package.json 不含 bin（部署后无该命令名），
        故统一用上面的 node <path>/dist/mcp-stdio.js 路径形式调用，不要依赖命令名。
      notes: >-
        与 HTTP 共用同一个 buildServer 与同一套 authenticatePat，无第二份工具注册实现。
        启动即校验 GX_MCP_TOKEN：缺失/为空/非法/不可用一律退出码 2，stderr 文案区分具体原因；
        通道纪律：stdout 只写 JSON-RPC 协议流，一切诊断走 stderr，绝不污染协议。
      audit-source: stdio（固定值；HTTP 入口记 ip 与 path）
  tools:
    catalog-source: apps/api/src/mcp/tools/catalog.ts（唯一真源；工具入参 schema 真源为 tools/schemas.ts）
    gating: >-
      闸门一（令牌侧粗筛）：PAT scope 不含写位时写工具不入册；闸门二（资源侧）：
      族可见集为空则该族工具不出现在 tools/list。故 tools/list 的实际返回是
      "令牌作用域 与 该主体 M4 可见集"的交集，不是固定 14 项。
    field-level-narrowing: >-
      字段级可见性由 M4 节点策略行的 fieldMask.allowFields 决定，其语义是
      **在 M4 可见集之上的显式收窄白名单（allow 之上再裁剪），不是 deny 清单，也不是独立授权来源**。
      即：字段最终可见 = 资源可见（M4 决定整条记录看不看得到）∩ allowFields（决定看得到哪些列）；
      缺省或空 fieldMask 等于不裁剪。PAT scope 只做族级粗筛，不参与字段判定。
      对外不泄漏区别：请求了不在 allowFields 里的字段，与请求不可见资源，分别走
      FORBIDDEN_FIELD 与 FORBIDDEN_RESOURCE；读路径则表现为该字段物理缺席（不起"这里有个字段你看不到"的提示）。
    count-note: >-
      目录共 15 项，其中 record.search 受 GX_M5_SEARCH 门控：off 时该项不出现在 tools/list，
      准入目 14 项。工具名与 scope 如下（family=null 表示不绑资源族）。
    list:
      - { name: ping_echo, scopes: [], readOnly: true, family: null, note: 连通性自检，对任何已认证主体恒可见 }
      - { name: table.list_bases, scopes: [record:read], readOnly: true, family: table, note: 列出经 M4 可见集与逐 base 复核后的 base id }
      - { name: table.get_schema, scopes: [record:read], readOnly: true, family: table, note: 不可见字段不出现在 schema 中 }
      - { name: record.list_records, scopes: [record:read], readOnly: true, family: table, note: keyset 游标分页，limit 上限 200 }
      - { name: record.query_records, scopes: [record:read], readOnly: true, family: table, note: filter/sort 算子白名单，禁公式与裸 SQL }
      - { name: record.create_record, scopes: [record:write], readOnly: false, family: table, note: 需 confirm=true；字段映射逐列受字段级写权约束 }
      - { name: record.update_record, scopes: [record:write], readOnly: false, family: table, note: payload 含不可见字段键则整单拒绝 }
      - { name: record.delete_record, scopes: [record:write], readOnly: false, family: table, note: 软删，与 REST DELETE 同语义，需 confirm=true }
      - { name: record.search, scopes: [record:read], readOnly: true, family: null, conditional: GX_M5_SEARCH 不等于 off, note: M5 统一检索薄封装；off 时工具缺席 }
      - { name: doc.get_doc_blocks, scopes: [doc:read], readOnly: true, family: doc, note: format=blocks 走共享块模型；range 按块序号 0-based 闭区间 }
      - { name: doc.append_blocks, scopes: [doc:write], readOnly: false, family: doc, note: 单事务一次内容版本递增，需 baseVersion 乐观锁 }
      - { name: doc.update_block, scopes: [doc:write], readOnly: false, family: doc, note: 块不存在整单拒绝，需 baseVersion }
      - { name: doc.delete_blocks, scopes: [doc:write], readOnly: false, family: doc, note: 原子批删，任一 id 不存在则整批失败、无半应用，需 confirm 与 baseVersion }
      - { name: canvas.get_board, scopes: [canvas:read], readOnly: true, family: canvas, note: 元素原样返回，未知键不剥离 }
      - { name: canvas.commit_elements, scopes: [canvas:write], readOnly: false, family: canvas, note: 当前最小集仅 op element.create；其它操作名整批 UNSUPPORTED_OPERATION，需 confirm 与 baseVersion }
  tool-error-envelope:
    transport: >-
      工具的业务失败不是 HTTP 错误：协议层仍回 200，result.isError 为 true，
      content[0].text 为结构化 JSON 体（SDK 客户端把它包成 -32602 载荷，直读 HTTP 时就是同一段 JSON 文本）。
      客户端必须按 JSON 体里的 code 判分支，不能只看 HTTP 状态。
    codes:
      - { code: OK, note: 成功 }
      - { code: UNKNOWN_TOOL, note: 工具名不存在或未入册（未入册含"作用域不够"与"族不可见"两种情况，不外泄具体原因） }
      - { code: UNSUPPORTED_OPERATION, note: 操作名不在本期最小集（如画布非 element.create 的 op） }
      - { code: FORBIDDEN_RESOURCE, note: 主体已认证但本次资源/动作无权 }
      - { code: FORBIDDEN_FIELD, note: payload 含不可见/只读字段键，整单拒绝 }
      - { code: VERSION_CONFLICT, note: 乐观锁失配，响应带 currentVersion }
      - { code: CONFIRM_REQUIRED, note: 破坏性操作缺 confirm=true }
      - { code: RATE_LIMITED, note: 工具面限流（协议层 200 承载，与 HTTP 429 是两个不同层级） }
      - { code: TIMEOUT, note: 单次工具调用超过 GX_MCP_TOOL_TIMEOUT_MS（默认 30000） }
      - { code: INVALID_PARAMS, note: 入参不符工具 schema }
    non-disclosure: >-
      不可见资源与不存在资源返回同一码同一文案（逐字节一致），不泄漏存在性：
      既不区分"你没有权限"与"它不存在"，也不在响应体/审计里回显被拒资源的内容。
      IDOR 四条逐字节对拍证据见 docs/baseline/m6-connectivity.md §5。
  payload-limit:
    applies-to: /mcp 精确路径（去 basePath 前缀后比较，不做前缀放宽以免误伤 /api）
    mcp-bytes: 11534336
    mcp-human: 11MB（GX_MCP_BODY_LIMIT，默认值）
    other-tiers: /api JSON 默认 1MB、头像上传 6MB，两档语义不变
    over-limit: 413，机器码 MCP_PAYLOAD_TOO_LARGE（与 /api 的 PAYLOAD_TOO_LARGE 区分）
    proxy-margin: >-
      裸机部署 Caddy 侧 request_body max_size 为 12MB，与 /mcp 的 11MB 之间留 1MB 余量；
      改小 /mcp 上限不必动 Caddy，改大则必须同步放大 Caddy 侧，否则请求在反代层先被拒。
  http-layer-errors:
    note: >-
      /mcp 只有这五种情况是 HTTP 层错误（其余一切，含工具业务失败，都是 HTTP 200 承载 JSON-RPC）。
      这五种里只有 413 与 429 带 {error, code} 信封，401 带 JSON-RPC 错误体，406/415 由传输层直接产生。
    list:
      - { status: 401, code: -32001, note: 边缘认证失败；附 WWW-Authenticate 与 JSON-RPC 错误体 }
      - { status: 413, code: MCP_PAYLOAD_TOO_LARGE, note: 请求体超过 /mcp 档上限 }
      - { status: 429, code: -32029, note: 两段式限流任一命中；附 Retry-After 与 X-RateLimit-* }
      - { status: 406, note: Accept 头不含 application/json 或 text/event-stream（传输层判定） }
      - { status: 415, note: Content-Type 不是 application/json（传输层判定） }
  rate-limit:
    algorithm: 固定窗口（进程内内存计数，单实例部署前提，与全局限流同纪律）
    stages:
      - stage: 1
        position: 认证前
        key: sourceIp
        limit: 300
        window-seconds: 60
        env: GX_MCP_RATE_IP_MAX 与 GX_MCP_RATE_WINDOW_SEC
        purpose: 防止未认证流量打爆认证与权限层
      - stage: 2
        position: 认证后
        key: 'pat:<patId>'
        limit: 120
        window-seconds: 60
        env: GX_MCP_RATE_PAT_MAX 与 GX_MCP_RATE_WINDOW_SEC
        purpose: 按令牌隔离配额，单令牌失控不影响他人
    response: >-
      HTTP 429 + Retry-After + X-RateLimit-Limit + X-RateLimit-Remaining，
      体 {"jsonrpc":"2.0","error":{"code":-32029,"message":"RATE_LIMITED"},"id":null}。
    relation-to-global: >-
      /mcp 的限流内聚在 /mcp 子应用内，全局规则表对 /mcp 仍返回 null（不改既有规则表）；
      /api/v1/pats 的创建/删除另有独立敏感档：默认 30 次/60 秒/人（键=userId），
      与 /mcp 两个桶分实例互不干扰，GET 列表不设该档。
  timeout:
    tool-timeout-ms: 30000
    env: GX_MCP_TOOL_TIMEOUT_MS
    behavior: >-
      单次工具调用超过该值时返回结构化 TIMEOUT（协议层 200，result.isError 为 true），
      并且不挂死连接：HTTP 连接随后仍可复用（同连接再发 ping_echo 正常）。
      证据见 docs/baseline/m6-connectivity.md §7.3。
  audit:
    events:
      - { event: mcp_pat_create, trigger: 'POST /api/v1/pats 成功', status: 201 }
      - { event: mcp_pat_revoke, trigger: 'DELETE /api/v1/pats/{id} 成功', status: 204 }
      - { event: mcp_tool_call, trigger: '每次 tools/call（成功与业务失败都记）', requestId: 随请求落库用于幂等 }
      - { event: mcp_auth_failure, trigger: '边缘认证失败（HTTP 与 stdio 两入口都记）' }
    never-log: >-
      完整 PAT 明文、Authorization 头原值、hashToken 的输入与输出、被拒资源的内容与名称。
      只允许记 14 字符前缀（不可认证）与 patId。该纪律由 e2e 的审计扫描用例守护
      （含随机段零泄漏断言），见 docs/baseline/m6-connectivity.md §4.4。

